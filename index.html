<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="Logo-dssc.png" type="image/png" />
    <title>32 숫자 퀴즈</title>
    <style>
      :root {
        --bg-color: #f5f5f7;
        --container-bg: rgba(255, 255, 255, 0.6);
        --text-color: #1d1d1f;
        --card-bg: rgba(255, 255, 255, 0.8);
        --card-shadow: rgba(0, 0, 0, 0.08);
        --accent-color: #007aff;
        --moon-color: #1d1d1f;
        --toggle-bg: #ffffff;
      }

      body.dark-mode {
        --bg-color: #000000;
        --container-bg: rgba(28, 28, 30, 0.7);
        --text-color: #ffffff;
        --card-bg: rgba(44, 44, 46, 0.8);
        --card-shadow: rgba(0, 0, 0, 0.4);
        --accent-color: #0a84ff;
        --moon-color: #ffffff;
        --toggle-bg: #1c1c1e;
      }

      body {
        font-family:
          'Pretendard',
          -apple-system,
          sans-serif;
        text-align: center;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: env(safe-area-inset-top) 20px;
        transition:
          background-color 0.6s ease,
          color 0.6s ease;
      }

      .container {
        max-width: 850px;
        margin: 80px auto;
        background: var(--container-bg);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        padding: 40px 20px;
        border-radius: 35px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 20px 60px var(--card-shadow);
      }

      /* 애플 스타일 원형 다크모드 버튼 */
      .theme-toggle {
        position: fixed;
        top: 25px;
        right: 25px;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--toggle-bg);
        border: 1px solid rgba(0, 0, 0, 0.05);
        cursor: pointer;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* 깔끔한 단색 초승달 아이콘 */
      .theme-toggle svg {
        width: 26px;
        height: 26px;
        fill: var(--moon-color);
        transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .theme-toggle:active {
        transform: scale(0.9);
      }

      /* 그리드 설정: PC 8*4 / Mobile 4*8 */
      .grid {
        display: grid;
        gap: 16px;
        margin-top: 30px;
        grid-template-columns: repeat(8, 1fr);
      }

      @media (max-width: 768px) {
        .grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      /* 리퀴드 글래스 버튼 */
      .card {
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--card-bg);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 20px;
        font-size: 1.4rem;
        font-weight: 700;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        box-shadow: 0 4px 12px var(--card-shadow);
        transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      /* 상단 하이라이트 효과 */
      .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 50%;
        background: linear-gradient(
          rgba(255, 255, 255, 0.3),
          rgba(255, 255, 255, 0)
        );
      }

      .card:active {
        transform: scale(0.9) translateY(3px);
        background: var(--accent-color);
        color: white;
      }

      .question-box {
        font-size: 1.65rem;
        line-height: 1.8;
        margin: 50px 0;
        color: var(--accent-color);
        white-space: pre-wrap;
        word-break: keep-all;
        font-weight: 600;
      }

      .btn-back {
        padding: 16px 55px;
        border-radius: 20px;
        border: none;
        background: var(--text-color);
        color: var(--bg-color);
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      #quiz-page {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- 초승달 버튼 -->
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">
      <svg viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <div class="container">
      <div id="main-page">
        <h1 style="font-weight: 800; letter-spacing: -2px; margin-bottom: 40px">
          번호를 골라주세요!
        </h1>
        <div class="grid" id="card-grid"></div>
      </div>

      <div id="quiz-page">
        <h1 id="quiz-title" style="font-size: 1rem; opacity: 0.5">0번 문제</h1>
        <div id="question-text" class="question-box"></div>
        <button class="btn-back" onclick="goBack()">뒤로 가기</button>
      </div>
    </div>

    <script>
      const grid = document.getElementById('card-grid');
      for (let i = 1; i <= 32; i++) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerText = i;
        card.onclick = () => showQuiz(i);
        grid.appendChild(card);
      }

      const quizData = {
        1: `모든 시각장애인은 전혀 보지 못한다. \n O/X`,
        2: `시각장애인 동기와 점심을 먹으러 학생식당으로 이동합니다. \n같이 걸어갈 때 팔을 잡고 걸을 수 있도록 도움을 주어야 하는데 \n시각장애인 동기의 오른쪽과 왼쪽 중 어느 쪽에서 걸어가는 것이 좋을까요?`,
        3: `차도와 인도가 나란히 있는 길에서 시각장애인과 동행하는 경우 \n안내자는 시각장애인의 오른쪽과 왼쪽 중 어느 쪽에서 걸어가는 것이 좋을까요?`,
      };

      // 1초 확실하게 쉬는 TTS 함수 (Queue 방식)
      async function speak(text) {
        window.speechSynthesis.cancel();

        // 문장을 줄바꿈 기준으로 쪼개기
        const parts = text.split('\n');

        for (let i = 0; i < parts.length; i++) {
          if (parts[i].trim().length === 0) continue;

          await new Promise((resolve) => {
            const utterance = new SpeechSynthesisUtterance(parts[i]);
            utterance.lang = 'ko-KR';
            utterance.rate = 1.0;

            // 문장이 끝나면 1초 대기 후 다음 문장으로
            utterance.onend = () => {
              if (i < parts.length - 1) {
                setTimeout(resolve, 1000); // 1000ms = 1초 확실히 쉼
              } else {
                resolve();
              }
            };
            window.speechSynthesis.speak(utterance);
          });
        }
      }

      function showQuiz(num) {
        const question = quizData[num] || '문제가 아직 등록되지 않았습니다.';
        document.getElementById('main-page').style.display = 'none';
        document.getElementById('quiz-page').style.display = 'block';
        document.getElementById('quiz-title').innerText = num + '번 문제';
        document.getElementById('question-text').innerText = question;

        const fullText = `${num}번 문제입니다. \n ${question} \n 정답은 무엇일까요?`;
        speak(fullText);
      }

      function goBack() {
        window.speechSynthesis.cancel();
        document.getElementById('main-page').style.display = 'block';
        document.getElementById('quiz-page').style.display = 'none';
      }

      function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const icon = document.querySelector('.theme-toggle svg');
        if (document.body.classList.contains('dark-mode')) {
          icon.style.transform = 'rotate(-160deg) scale(1.1)';
        } else {
          icon.style.transform = 'rotate(0deg) scale(1)';
        }
      }
    </script>
  </body>
</html>
