<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="Logo-dssc.png" type="image/png" />
    <title>퀴즈 Time!</title>
    <style>
      :root {
        --bg-main: linear-gradient(135deg, #e0f2ff 0%, #b3d9ff 100%);
        --container-bg: rgba(255, 255, 255, 0.4);
        --text-color: #2c3e50;
        --glass-white: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(255, 255, 255, 0.5);
        --glass-shadow: rgba(0, 0, 0, 0.05);
        --glass-green: rgba(52, 199, 89, 0.85);
        --glass-red: rgba(255, 59, 48, 0.85);
      }
      body.dark-mode {
        --bg-main: linear-gradient(135deg, #1a1a1a 0%, #001f3f 100%);
        --container-bg: rgba(0, 0, 0, 0.5);
        --text-color: #ffffff;
        --glass-white: rgba(255, 255, 255, 0.15);
        --glass-border: rgba(255, 255, 255, 0.1);
      }
      body {
        font-family: 'Pretendard', sans-serif;
        text-align: center;
        background: var(--bg-main);
        background-attachment: fixed;
        color: var(--text-color);
        margin: 0;
        min-height: 100vh;
        padding: env(safe-area-inset-top) 20px 120px 20px;
        transition: background 0.6s ease;
      }
      .container {
        max-width: 850px;
        margin: 60px auto;
        background: var(--container-bg);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        padding: 50px 20px;
        border-radius: 40px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 25px 50px var(--glass-shadow);
      }
      /* 테마 토글 애니메이션 추가 */
      .theme-toggle {
        position: fixed;
        top: 25px;
        right: 25px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: var(--glass-white);
        border: 1px solid var(--glass-border);
        cursor: pointer;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .theme-toggle:active {
        transform: scale(0.8);
      }
      .theme-toggle svg {
        transition: transform 0.5s ease;
      }
      .theme-toggle.active svg {
        transform: rotate(360deg) scale(1.2);
      }

      .grid {
        display: grid;
        gap: 15px;
        margin-top: 35px;
        grid-template-columns: repeat(8, 1fr);
      }
      @media (max-width: 768px) {
        .grid {
          grid-template-columns: repeat(5, 1fr);
        }
      }
      .card {
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--glass-white);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        font-size: 1.3rem;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 5px 15px var(--glass-shadow);
        transition: transform 0.2s;
      }
      .card.locked {
        opacity: 0.2;
        filter: grayscale(1);
        pointer-events: none;
      }
      .card.admin-gate {
        opacity: 1 !important;
        filter: none !important;
        pointer-events: auto !important;
      }

      #options-grid {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin: 30px auto;
        width: 100%;
      }
      .layout-row {
        flex-direction: row;
      }
      .layout-col {
        flex-direction: column;
      }
      .opt-btn {
        padding: 20px;
        border-radius: 20px;
        border: 1px solid var(--glass-border);
        background: var(--glass-white);
        color: var(--text-color);
        font-size: 1.4rem;
        font-weight: 800;
        cursor: pointer;
        position: relative;
        overflow: hidden;
      }
      .opt-btn.btn-o {
        background: var(--glass-green);
        color: white;
      }
      .opt-btn.btn-x {
        background: var(--glass-red);
        color: white;
      }
      .opt-btn.is-ox {
        aspect-ratio: 1 / 1;
        max-width: 150px;
        font-size: 2.5rem;
        flex: 1;
      }

      .footer {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 15px 30px;
        background: var(--glass-white);
        backdrop-filter: blur(15px);
        border-radius: 50px;
        border: 1px solid var(--glass-border);
        text-decoration: none;
        color: var(--text-color);
      }
      #quiz-page {
        display: none;
      }
    </style>
  </head>
  <body>
    <button class="theme-toggle" onclick="handleThemeClick()" id="themeBtn">
      <svg viewBox="0 0 24 24" width="28" fill="currentColor">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <div class="container">
      <div id="main-page">
        <h1 style="font-weight: 900; letter-spacing: -2px; font-size: 2.2rem">
          뽑기에서 나온 번호에 맞는 숫자를 선택해주세요!
        </h1>
        <div class="grid" id="card-grid"></div>
      </div>

      <div id="quiz-page">
        <h1 id="quiz-title" style="font-size: 1.1rem; opacity: 0.6"></h1>
        <div
          id="question-text"
          style="
            font-size: 1.8rem;
            margin: 40px 0;
            font-weight: 800;
            line-height: 1.5;
            word-break: keep-all;
          "
        ></div>
        <div id="options-grid"></div>
        <div
          id="result-msg"
          style="margin-top: 30px; font-size: 1.6rem; font-weight: 900"
        ></div>
        <button
          onclick="goBack()"
          style="
            margin-top: 50px;
            padding: 16px 60px;
            border-radius: 20px;
            border: none;
            background: var(--text-color);
            color: white;
            font-weight: 800;
            cursor: pointer;
          "
        >
          목록으로 돌아가기
        </button>
      </div>
    </div>

    <a href="https://www.instagram.com/dku_dssc" target="_blank" class="footer">
      <span style="font-weight: 800; font-size: 1rem"
        >단국대 장애학생지원센터</span
      >
    </a>

    <script>
      let solveTime = null;
      let currentQuizType = null;

      const quizData = {
        1: {
          q: `모든 시각장애인은 전혀 보지 못한다.`,
          opt: ['O', 'X'],
          ans: 'X',
        },
        2: {
          q: `시각장애인 동기와 점심을 먹으러 학생식당으로 이동합니다. \n 같이 걸어갈 때 팔을 잡고 걸을 수 있도록 도움을 주어야 하는데 \n 시각장애인 동기의 오른쪽과 왼쪽 중 어느 쪽에서 걸어가는 것이 좋을까요?`,
          opt: ['정답은 운영진에게 말해주세요'],
          ans: 'staff',
        },
        30: {
          q: '관리자 모드: 초기화하시겠습니까?',
          opt: ['리셋하기', '취소'],
          ans: '리셋하기',
        },
      };

      const checkLock = () => localStorage.getItem('quiz_completed') === 'true';

      function updateGrid() {
        const grid = document.getElementById('card-grid');
        grid.innerHTML = '';
        const isLocked = checkLock();
        for (let i = 1; i <= 30; i++) {
          const card = document.createElement('div');
          card.innerText = i;
          card.className =
            'card' +
            (isLocked ? ' locked' : '') +
            (i === 30 ? ' admin-gate' : '');
          card.onclick = () => {
            if (i === 30) {
              if (confirm('모든 기록을 리셋할까요?')) {
                localStorage.removeItem('quiz_completed');
                location.reload();
              }
              return;
            }
            if (!checkLock()) showQuiz(i);
          };
          grid.appendChild(card);
        }
      }

      updateGrid();

      function showQuiz(num) {
        const data = quizData[num] || {
          q: `${num}번 준비 중!`,
          opt: ['확인'],
          ans: '확인',
        };
        currentQuizType = data.ans;
        solveTime = null; // 초기화

        document.getElementById('main-page').style.display = 'none';
        document.getElementById('quiz-page').style.display = 'block';
        document.getElementById('quiz-title').innerText = `${num}번 문제`;
        document.getElementById('question-text').innerText = data.q;

        const optGrid = document.getElementById('options-grid');
        optGrid.innerHTML = '';
        optGrid.style.pointerEvents = 'auto';
        optGrid.className = data.opt.length <= 2 ? 'layout-row' : 'layout-col';

        data.opt.forEach((o) => {
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.innerText = o;
          if (o === 'O') btn.classList.add('is-ox', 'btn-o');
          else if (o === 'X') btn.classList.add('is-ox', 'btn-x');
          btn.onclick = () => checkAnswer(num, o, data.ans);
          optGrid.appendChild(btn);
        });
      }

      function checkAnswer(num, userAns, correctAns) {
        // 일단 잠금 기록 저장
        localStorage.setItem('quiz_completed', 'true');

        if (correctAns === 'staff') {
          solveTime = Date.now(); // 2번 같은 특수 문제만 시간 기록
        }

        const msg = document.getElementById('result-msg');
        msg.innerHTML = '';

        if (correctAns !== 'staff') {
          if (userAns === correctAns)
            msg.innerHTML =
              "<span style='color: #27ae60;'>정답입니다! 🎉</span>";
          else
            msg.innerHTML =
              "<span style='color: #e74c3c;'>아쉽네요! 다음에 다시 도전해주세요</span>";
        }

        document.getElementById('options-grid').style.pointerEvents = 'none';
      }

      function goBack() {
        // [수정된 로직]
        // Staff 타입 문제이면서, solveTime이 존재하고, 10초(10000ms)가 채 안 지났을 때만 잠금 해제
        if (currentQuizType === 'staff' && solveTime !== null) {
          const elapsed = Date.now() - solveTime;
          if (elapsed < 10000) {
            localStorage.removeItem('quiz_completed');
          }
        }

        document.getElementById('main-page').style.display = 'block';
        document.getElementById('quiz-page').style.display = 'none';
        solveTime = null;
        updateGrid(); // 목록으로 돌아올 때 그리드 상태 강제 업데이트
      }

      let themeClicks = 0;
      function handleThemeClick() {
        const btn = document.getElementById('themeBtn');
        btn.classList.add('active');
        setTimeout(() => btn.classList.remove('active'), 500);

        themeClicks++;
        if (themeClicks === 1) {
          document.body.classList.toggle('dark-mode');
          setTimeout(() => {
            themeClicks = 0;
          }, 600);
        }
        if (themeClicks >= 3) {
          localStorage.removeItem('quiz_completed');
          alert('관리자 모드: 리셋되었습니다.');
          location.reload();
        }
      }
    </script>
  </body>
</html>
