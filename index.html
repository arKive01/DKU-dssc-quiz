<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="Logo-dssc.png" type="image/png" />
    <title>퀴즈 Time!</title>
    <style>
      :root {
        --bg-main: linear-gradient(135deg, #e0f2ff 0%, #b3d9ff 100%);
        --container-bg: rgba(255, 255, 255, 0.4);
        --text-color: #2c3e50;
        --glass-white: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(255, 255, 255, 0.5);
        --glass-shadow: rgba(0, 0, 0, 0.05);
        --glass-green: rgba(52, 199, 89, 0.85);
        --glass-red: rgba(255, 59, 48, 0.85);
      }

      body.dark-mode {
        --bg-main: linear-gradient(135deg, #1a1a1a 0%, #001f3f 100%);
        --container-bg: rgba(0, 0, 0, 0.5);
        --text-color: #ffffff;
        --glass-white: rgba(255, 255, 255, 0.15);
        --glass-border: rgba(255, 255, 255, 0.1);
      }

      body {
        font-family:
          'Pretendard',
          -apple-system,
          sans-serif;
        text-align: center;
        background: var(--bg-main);
        background-attachment: fixed;
        color: var(--text-color);
        margin: 0;
        min-height: 100vh;
        padding: env(safe-area-inset-top) 20px 120px 20px;
        transition: background 0.6s ease;
      }

      .container {
        max-width: 850px;
        margin: 60px auto;
        background: var(--container-bg);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        padding: 50px 20px;
        border-radius: 40px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 25px 50px var(--glass-shadow);
      }

      .theme-toggle {
        position: fixed;
        top: 25px;
        right: 25px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: var(--glass-white);
        border: 1px solid var(--glass-border);
        cursor: pointer;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .grid {
        display: grid;
        gap: 15px;
        margin-top: 35px;
        grid-template-columns: repeat(8, 1fr);
      }
      @media (max-width: 768px) {
        .grid {
          grid-template-columns: repeat(5, 1fr);
        }
      }

      .card {
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--glass-white);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        font-size: 1.3rem;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 5px 15px var(--glass-shadow);
        transition: transform 0.2s;
      }
      .card.locked {
        opacity: 0.2;
        filter: grayscale(1);
        pointer-events: none;
      }
      /* 관리자 초기화용 30번 항상 활성화 */
      .card.admin-gate {
        opacity: 1 !important;
        filter: none !important;
        pointer-events: auto !important;
      }

      #options-grid {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin: 30px auto;
        width: 100%;
      }
      .layout-row {
        flex-direction: row;
      }
      .layout-col {
        flex-direction: column;
      }

      .opt-btn {
        padding: 20px;
        border-radius: 20px;
        border: 1px solid var(--glass-border);
        background: var(--glass-white);
        color: var(--text-color);
        font-size: 1.4rem;
        font-weight: 800;
        cursor: pointer;
        position: relative;
        overflow: hidden;
      }
      .opt-btn.btn-o {
        background: var(--glass-green);
        color: white;
      }
      .opt-btn.btn-x {
        background: var(--glass-red);
        color: white;
      }
      .opt-btn.is-ox {
        aspect-ratio: 1 / 1;
        max-width: 150px;
        font-size: 2.5rem;
        flex: 1;
      }
      .layout-col .opt-btn {
        width: 100%;
      }

      .opt-btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 50%;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.3) 0%,
          rgba(255, 255, 255, 0) 100%
        );
      }

      .footer {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 15px 30px;
        background: var(--glass-white);
        backdrop-filter: blur(15px);
        border-radius: 50px;
        border: 1px solid var(--glass-border);
        text-decoration: none;
        color: var(--text-color);
      }

      .confetti {
        position: fixed;
        z-index: 2000;
        pointer-events: none;
      }
      #quiz-page {
        display: none;
      }
    </style>
  </head>
  <body>
    <button class="theme-toggle" onclick="handleThemeClick()" id="themeBtn">
      <svg viewBox="0 0 24 24" width="28" fill="currentColor">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <div class="container">
      <div id="main-page">
        <h1 style="font-weight: 900; letter-spacing: -2px; font-size: 2.2rem">
          뽑기에서 나온 번호에 맞는 숫자를 선택해주세요!
        </h1>
        <div class="grid" id="card-grid"></div>
      </div>

      <div id="quiz-page">
        <h1 id="quiz-title" style="font-size: 1.1rem; opacity: 0.6"></h1>
        <div
          id="question-text"
          style="
            font-size: 1.8rem;
            margin: 40px 0;
            font-weight: 800;
            line-height: 1.5;
            word-break: keep-all;
          "
        ></div>
        <div id="options-grid"></div>
        <div
          id="result-msg"
          style="margin-top: 30px; font-size: 1.6rem; font-weight: 900"
        ></div>
        <button
          onclick="goBack()"
          style="
            margin-top: 50px;
            padding: 16px 60px;
            border-radius: 20px;
            border: none;
            background: var(--text-color);
            color: white;
            font-weight: 800;
            cursor: pointer;
          "
        >
          목록으로 돌아가기
        </button>
      </div>
    </div>

    <a href="https://www.instagram.com/dku_dssc" target="_blank" class="footer">
      <span style="font-weight: 800; font-size: 1rem"
        >단국대 장애학생지원센터</span
      >
    </a>

    <script>
      let solveTime = null; // 뒤로가기 유예 시간용

      const quizData = {
        1: {
          q: `모든 시각장애인은 전혀 보지 못한다.`,
          opt: ['O', 'X'],
          ans: 'X',
        },
        2: {
          q: `시각장애인 동기와 점심을 먹으러 학생식당으로 이동합니다. \n 같이 걸어갈 때 팔을 잡고 걸을 수 있도록 도움을 주어야 하는데 \n 시각장애인 동기의 오른쪽과 왼쪽 중 어느 쪽에서 걸어가는 것이 좋을까요?`,
          opt: ['정답은 운영진에게 말해주세요'],
          ans: 'staff', // 'staff'로 설정하면 정답 문구가 뜨지 않음
        },
        // 동일한 형태의 문제가 더 필요하면 ans: 'staff' 로 추가하시면 됩니다.
        30: {
          q: '관리자 모드: 비밀의 문\n데이터를 초기화하시겠습니까?',
          opt: ['리셋하기', '취소'],
          ans: '리셋하기',
        },
      };

      const checkLock = () => localStorage.getItem('quiz_completed') === 'true';

      // 메인 페이지 카드 생성
      const updateGrid = () => {
        const grid = document.getElementById('card-grid');
        grid.innerHTML = '';
        for (let i = 1; i <= 30; i++) {
          const card = document.createElement('div');
          card.innerText = i;
          const isLocked = checkLock();
          card.className =
            'card' +
            (isLocked ? ' locked' : '') +
            (i === 30 ? ' admin-gate' : '');

          card.onclick = () => {
            if (i === 30) {
              if (confirm('모든 퀴즈 참여 기록을 초기화할까요?')) {
                localStorage.removeItem('quiz_completed');
                location.reload();
              }
              return;
            }
            if (!checkLock()) showQuiz(i);
          };
          grid.appendChild(card);
        }
      };

      updateGrid();

      async function speak(text) {
        window.speechSynthesis.cancel();
        const parts = text.split('\n');
        for (const part of parts) {
          if (!part.trim()) continue;
          await new Promise((resolve) => {
            const utterance = new SpeechSynthesisUtterance(part);
            utterance.lang = 'ko-KR';
            utterance.rate = 1.0;
            utterance.onend = () => setTimeout(resolve, 550);
            window.speechSynthesis.speak(utterance);
          });
        }
      }

      function showQuiz(num) {
        const data = quizData[num] || {
          q: `${num}번 준비 중!`,
          opt: ['확인'],
          ans: '확인',
        };
        document.getElementById('main-page').style.display = 'none';
        document.getElementById('quiz-page').style.display = 'block';
        document.getElementById('quiz-title').innerText = `${num}번 문제`;
        document.getElementById('question-text').innerText = data.q;

        const optGrid = document.getElementById('options-grid');
        optGrid.innerHTML = '';
        optGrid.style.pointerEvents = 'auto'; // 잠금 해제
        optGrid.className = data.opt.length <= 2 ? 'layout-row' : 'layout-col';

        data.opt.forEach((o) => {
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.innerText = o;
          if (o === 'O') btn.classList.add('is-ox', 'btn-o');
          else if (o === 'X') btn.classList.add('is-ox', 'btn-x');
          else if (data.opt.length <= 2) btn.style.flex = '1';

          btn.onclick = () => checkAnswer(num, o, data.ans);
          optGrid.appendChild(btn);
        });

        speak(`${num}번 문제입니다. \n ${data.q} \n 정답은 무엇일까요.`);
      }

      function checkAnswer(num, userAns, correctAns) {
        // 즉시 잠금 기록
        localStorage.setItem('quiz_completed', 'true');
        solveTime = Date.now();

        const msg = document.getElementById('result-msg');
        msg.innerHTML = ''; // 초기화

        // 'staff' 타입인 경우 아무런 피드백을 주지 않음 (운영진 대면용)
        if (correctAns !== 'staff') {
          if (userAns === correctAns) {
            msg.innerHTML =
              "<span style='color: #27ae60;'>정답입니다! 🎉</span>";
            fireConfetti();
          } else {
            msg.innerHTML =
              "<span style='color: #e74c3c;'>아쉽네요! 다음에 다시 도전해주세요</span>";
          }
        }

        // 옵션 클릭 막기 및 메인 카드 잠금 시각화
        document.getElementById('options-grid').style.pointerEvents = 'none';
        updateGrid();
      }

      function fireConfetti() {
        const emojis = ['🎉', '🎊', '✨', '🎈', '⭐'];
        for (let i = 0; i < 55; i++) {
          const c = document.createElement('div');
          c.className = 'confetti';
          c.innerText = emojis[Math.floor(Math.random() * emojis.length)];
          c.style.left = Math.random() * 100 + 'vw';
          c.style.top = '-80px';
          c.style.fontSize = Math.random() * 30 + 45 + 'px';
          c.style.transition = `all ${Math.random() * 2.5 + 3}s cubic-bezier(0.1, 0.5, 0.5, 1)`;
          document.body.appendChild(c);
          setTimeout(() => {
            c.style.top = '120vh';
            c.style.transform = `rotate(${Math.random() * 1000}deg) translateX(${Math.random() * 200 - 100}px)`;
          }, 10);
          setTimeout(() => c.remove(), 6000);
        }
      }

      function goBack() {
        window.speechSynthesis.cancel();

        // 🕒 10초 이내 뒤로가기 클릭 시 "실수"로 간주하고 잠금 해제
        if (solveTime && Date.now() - solveTime < 10000) {
          localStorage.removeItem('quiz_completed');
        }

        document.getElementById('main-page').style.display = 'block';
        document.getElementById('quiz-page').style.display = 'none';
        document.getElementById('result-msg').innerHTML = '';
        solveTime = null;
        updateGrid(); // 그리드 상태 동기화
      }

      let clicks = 0;
      function handleThemeClick() {
        clicks++;
        if (clicks === 1) {
          document.body.classList.toggle('dark-mode');
          setTimeout(() => {
            clicks = 0;
          }, 600);
        }
        if (clicks >= 3) {
          localStorage.removeItem('quiz_completed');
          alert('관리자 리셋 완료!');
          location.reload();
        }
      }
    </script>
  </body>
</html>
