<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 모바일 주소창 / 탭 컬러 통일 -->
    <meta name="theme-color" content="#b3d9ff" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <link rel="icon" href="Logo-dssc.png" type="image/png" />
    <title>퀴즈 Time!</title>
    <style>
      :root {
        --bg-main: linear-gradient(
          180deg,
          #b3d9ff 0%,
          #b3d9ff 10%,
          #cce7ff 35%,
          #d9ecff 65%,
          #b3d9ff 90%,
          #b3d9ff 100%
        );
        --bg-solid: #b3d9ff;
        --container-bg: rgba(255, 255, 255, 0.4);
        --text-color: #2c3e50;
        --glass-white: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(255, 255, 255, 0.5);
        --glass-shadow: rgba(0, 0, 0, 0.05);
        --glass-green: rgba(52, 199, 89, 0.85);
        --glass-red: rgba(255, 59, 48, 0.85);
        /* 목록으로 돌아가기 버튼 */
        --back-btn-bg: #2c3e50;
        --back-btn-text: #ffffff;
        /* 달 아이콘 */
        --moon-color: #0a84ff;
      }
      html.dark-mode {
        --bg-main: linear-gradient(
          180deg,
          #001f3f 0%,
          #001f3f 10%,
          #0a2d50 35%,
          #0f1e30 65%,
          #001f3f 90%,
          #001f3f 100%
        );
        --bg-solid: #001f3f;
        --container-bg: rgba(0, 0, 0, 0.5);
        --text-color: #ffffff;
        --glass-white: rgba(255, 255, 255, 0.15);
        --glass-border: rgba(255, 255, 255, 0.1);
        /* 저시력 가독성 고려 */
        --back-btn-bg: #7da8d6;
        --back-btn-text: #0f1720;
        /* 개나리 느낌 노랑 */
        --moon-color: #ffd93b;
      }
      /* body도 변수 상속받도록 */
      body.dark-mode {
        --bg-main: linear-gradient(
          180deg,
          #001f3f 0%,
          #001f3f 10%,
          #0a2d50 35%,
          #0f1e30 65%,
          #001f3f 90%,
          #001f3f 100%
        );
        --bg-solid: #001f3f;
        --container-bg: rgba(0, 0, 0, 0.5);
        --text-color: #ffffff;
        --glass-white: rgba(255, 255, 255, 0.15);
        --glass-border: rgba(255, 255, 255, 0.1);
        --back-btn-bg: #7da8d6;
        --back-btn-text: #0f1720;
        --moon-color: #ffd93b;
      }
      /* 전체 스크롤 제거 + 상하단 배경 연결 */
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: auto;
        touch-action: manipulation;
      }
      html {
        background: var(--bg-solid);
        transition: background 0.6s ease;
      }
      body {
        font-family: 'Pretendard', sans-serif;
        text-align: center;
        background: var(--bg-main);
        background-attachment: fixed;
        background-repeat: no-repeat;
        background-size: cover;
        color: var(--text-color);
        margin: 0;
        min-height: 100dvh;
        height: 100dvh;
        padding: env(safe-area-inset-top) 20px
          calc(env(safe-area-inset-bottom) + 120px) 20px;
        box-sizing: border-box;
        transition:
          background 0.6s ease,
          color 0.4s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        width: 100%;
        max-width: 850px;
        max-height: calc(100dvh - 40px);
        overflow: hidden;
        margin: 10px auto 0;
        background: var(--container-bg);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        padding: 30px 20px;
        border-radius: 40px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 25px 50px var(--glass-shadow);
        box-sizing: border-box;
      }
      .grid {
        display: grid;
        gap: 12px;
        margin-top: 30px;
        grid-template-columns: repeat(8, 1fr);
      }
      @media (max-width: 768px) {
        .grid {
          grid-template-columns: repeat(5, 1fr);
        }
        .container {
          padding: 24px 16px;
          border-radius: 30px;
        }
        #question-text {
          font-size: 1.25rem !important;
        }
        .opt-btn {
          font-size: 1rem !important;
          padding: 16px !important;
        }
        .bottom-bar {
          bottom: 18px !important;
        }
      }
      @media (max-width: 390px) {
        .grid {
          gap: 8px;
        }
        .card {
          font-size: 1rem;
          border-radius: 14px;
        }
        .container {
          padding: 18px 12px;
        }
      }
      .card {
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--glass-white);
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        font-size: 1.2rem;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 5px 15px var(--glass-shadow);
        transition:
          transform 0.2s,
          background 0.4s;
        -webkit-tap-highlight-color: transparent;
      }
      .card:active {
        transform: scale(0.94);
      }
      .card.locked {
        opacity: 0.2;
        filter: grayscale(1);
        pointer-events: none;
      }
      .card.admin-gate {
        opacity: 1 !important;
        filter: none !important;
        pointer-events: auto !important;
      }
      #question-text {
        font-size: 1.5rem;
        margin: 30px 0;
        font-weight: 800;
        line-height: 1.6;
        word-break: keep-all;
        white-space: pre-line;
      }
      #options-grid {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin: 25px auto;
        width: 100%;
      }
      .layout-row {
        flex-direction: row;
      }
      .layout-col {
        flex-direction: column;
      }
      .opt-btn {
        padding: 18px;
        border-radius: 20px;
        border: 1px solid var(--glass-border);
        background: var(--glass-white);
        color: var(--text-color);
        font-size: 1.2rem;
        font-weight: 800;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition:
          transform 0.18s ease,
          opacity 0.25s ease,
          background 0.4s;
        -webkit-tap-highlight-color: transparent;
      }
      .opt-btn:active {
        transform: scale(0.96);
      }
      .opt-btn.btn-o {
        background: var(--glass-green);
        color: white;
      }
      .opt-btn.btn-x {
        background: var(--glass-red);
        color: white;
      }
      .opt-btn.is-ox {
        aspect-ratio: 1 / 1;
        max-width: 120px;
        font-size: 2.2rem;
        flex: 1;
      }
      /* 목록으로 돌아가기 버튼 */
      .back-btn {
        margin-top: 40px;
        padding: 15px 50px;
        border-radius: 20px;
        border: none;
        background: var(--back-btn-bg);
        color: var(--back-btn-text);
        font-weight: 800;
        cursor: pointer;
        transition:
          background 0.4s ease,
          color 0.4s ease,
          transform 0.2s ease;
      }
      .back-btn:active {
        transform: scale(0.96);
      }
      /* 푸터 다이나믹 아일랜드 스타일 */
      .bottom-bar {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 2000;
      }
      .footer {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 22px;
        background: var(--glass-white);
        backdrop-filter: blur(15px);
        border-radius: 50px;
        border: 1px solid var(--glass-border);
        text-decoration: none;
        color: var(--text-color);
        white-space: nowrap;
        transition:
          transform 0.2s ease,
          background 0.4s;
        -webkit-tap-highlight-color: transparent;
      }
      .footer:active {
        transform: scale(0.94);
      }
      .footer span {
        font-weight: 800;
        font-size: 0.9rem;
        letter-spacing: -0.5px;
      }
      .theme-toggle {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: var(--glass-white);
        backdrop-filter: blur(15px);
        border: 1px solid var(--glass-border);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          transform 0.45s cubic-bezier(0.4, 0, 0.2, 1),
          background 0.4s,
          opacity 0.2s;
        will-change: transform;
        -webkit-tap-highlight-color: transparent;
      }
      .theme-toggle svg {
        transition:
          transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
          opacity 0.3s ease,
          fill 0.4s ease;
        will-change: transform;
        fill: var(--moon-color);
      }
      /* 모바일에서도 확실하게 동작 */
      .theme-toggle.active {
        transform: scale(0.88);
      }
      .theme-toggle.active svg {
        transform: rotate(360deg) scale(1.25);
      }
      #quiz-page {
        display: none;
      }

      /* 인스타 넛지 — 리퀴드 글라스 플로팅 + 은은한 외부 광선 */
      @keyframes float-glow {
        0%,
        100% {
          transform: translateY(0) scale(1);
          box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }
        50% {
          transform: translateY(-10px) scale(1.05);
          box-shadow:
            0 0 16px rgba(255, 255, 255, 0.5),
            0 0 32px rgba(210, 235, 255, 0.3),
            0 12px 24px rgba(0, 0, 0, 0.1);
        }
      }
      .footer.nudging {
        animation: float-glow 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="main-page">
        <h1 style="font-weight: 900; letter-spacing: -1.5px; font-size: 1.8rem">
          뽑기에서 나온 번호에 맞는 숫자를 선택해주세요!
        </h1>
        <div class="grid" id="card-grid"></div>
      </div>
      <div id="quiz-page">
        <h1 id="quiz-title" style="font-size: 1rem; opacity: 0.6"></h1>
        <div id="question-text"></div>
        <div id="options-grid"></div>
        <div
          id="result-msg"
          style="margin-top: 25px; font-size: 1.5rem; font-weight: 900"
        ></div>
        <button onclick="goBack()" class="back-btn">목록으로 돌아가기</button>
      </div>
    </div>
    <canvas
      id="confetti-canvas"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
      "
    ></canvas>
    <div class="bottom-bar">
      <a
        href="https://www.instagram.com/dku_dssc"
        target="_blank"
        class="footer"
      >
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
          <path
            d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.266.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"
          />
        </svg>
        <span>단국대 장애학생지원센터</span>
      </a>
      <button class="theme-toggle" onclick="handleThemeClick()" id="themeBtn">
        <svg viewBox="0 0 24 24" width="24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
    <script>
      let solveTime = null;
      let currentQuizType = null;
      const quizData = {
        1: {
          q: `모든 시각장애인은 전혀 보지 못한다.`,
          opt: [`O`, `X`],
          ans: `X`,
        },
        2: {
          q: `시각장애인 동기와 점심을 먹으러 학생식당으로 이동합니다. \n
              같이 걸어갈 때 팔을 잡고 걸을 수 있도록 도움을 주어야 하는데 \n
              시각장애인 동기의 오른쪽과 왼쪽 중 어느 쪽에서 걸어가는 것이 좋을까요?`,
          opt: [`정답은 운영진에게 말해주세요`],
          ans: `staff`,
        },
        3: {
          q: `차도와 인도가 나란히 있는 길에서 시각장애인과 동행하는 경우 \n
              안내자는 시각장애인의 오른쪽과 왼쪽 중 어느 쪽에서 걸어가는 것이 좋을까요?`,
          opt: [`정답은 운영진에게 말해주세요`],
          ans: `staff`,
        },
        4: {
          q: `시각장애인 동기와 함께 걸을 때 어떻게 하는 것이 가장 좋은 방법일까요?`,
          opt: [
            `시각장애인 동기의 팔짱을 낀다.`,
            `시각장애인 동기의 손을 잡고 걷는다.`,
            `시각장애인 동기가 안내자의 팔꿈치를 잡도록 한다.`,
            `위험하니까 잡지 않고 나란히 걷는다.`,
          ],
          ans: `시각장애인 동기가 안내자의 팔꿈치를 잡도록 한다.`,
        },
        5: {
          q: `시각장애인이 보행 시 사용하는 지팡이(보조기구)의 올바른 명칭은?`,
          opt: [`정답은 운영진에게 말해주세요`],
          ans: `staff`,
        },
        6: {
          q: `청각장애인이 주로 사용하는 의사소통 방식은 수어이다.`,
          opt: [`O`, `X`],
          ans: `X`,
        },
        7: {
          q: `청각장애인 동기와 대화를 할 때 필요한 에티켓에는 무엇이 있을까요?`,
          opt: [`정답은 운영진에게 말해주세요`],
          ans: `staff`,
        },
        8: {
          q: `시끄러운 곳에서는 청각장애인 동기에게 무조건 크게 말해주어야 한다. \n
              그래야 더 잘들을 수 있다.`,
          opt: [`O`, `X`],
          ans: `X`,
        },
        9: {
          q: `청각장애인 동기와 학생 식당에서 대화하는데 너무 시끄러워서 잘 듣지를 못합니다. \n
              대화 말을 하면서 음성과 문자를 동시에 제시해 주면 좋은데 \n
              이때 가장 손쉽게 활용할 수 있는 기기는 무엇일까요?`,
          opt: [`정답은 운영진에게 말해주세요`],
          ans: `staff`,
        },
        10: {
          q: `청각장애인 동기와 녹강(녹화강의) 수업을 어떻게 들을 수 있을까요?`,
          opt: [`정답은 운영진에게 말해주세요`],
          ans: `staff`,
        },
        11: {
          q: `지체장애인은 무조건 휠체어를 사용한다.`,
          opt: [`O`, `X`],
          ans: `X`,
        },
        12: {
          q: `혜당관(학생회관) 1층에는 배리어프리 키오스크가 몇 개 있을까요?`,
          opt: [`정답은 운영진에게 말해주세요`],
          ans: `staff`,
        },
        13: {
          q: `자체장애인 동기와 계단을 내려갈 때는 반드시 잡아줘야 한다.`,
          opt: [`O`, `X`],
          ans: `X`,
        },
        14: {
          q: `엘리베이터를 타고 있는데 휠체어를 타고 있는 지체장애인이 있다면 \n
              엘리베이터 안에 있는 비장애인은 다 내려서 양보해야 한다.`,
          opt: [`O`, `X`],
          ans: `X`,
        },
        15: {
          q: `단국대에서 휠체어를 탄 지체장애인이 가장 가기 힘든 길은?`,
          opt: [
            `내리막길`,
            `오르막길`,
            `턱이 있는 길`,
            `정답은 운영진에게 말해주세요`,
          ],
          ans: `staff`,
        },
        16: {
          q: `시각, 청각, 언어 장애를 가지고 있으면서도 장애인 인권운동 등을 \n
              이끌었던 미국의 사회 운동가는 누구인가요?`,
          opt: [`정답은 운영진에게 말해주세요`],
          ans: `staff`,
        },
        17: {
          q: `우리 학교 학생 식당에는 휠체어석이 몇 개 있을까요?`,
          opt: [`정답은 운영진에게 말해주세요`],
          ans: `staff`,
        },
        18: {
          q: `학생 식당에는 점심시간에 도움을 줄 수 있는 도우미 학생이 배치되어 있다.`,
          opt: [`O`, `X`],
          ans: `O`,
        },
        19: {
          q: `다음은 사범대 2층 사진입니다. 무엇이 문제일까요? \n
              사진은 테이블을 참고해 주세요`,
          opt: [`정답은 운영진에게 말해주세요`],
          ans: `staff`,
        },
        20: {
          q: `장애학생은 비장애학생에게 도움을 줄 수 없다.`,
          opt: [`O`, `X`],
          ans: `X`,
        },
        21: {
          q: `우리 학교 장애학생지원센터는 어디에 있을까요? \n
              힌트는 공식 인스타그램을 참고해 보세요!`,
          opt: [`혜당관 410호`, `혜당관 412호`, `혜당관 414호`, `혜당관 416호`],
          ans: `혜당관 412호`,
        },
        22: {
          q: `장애학생지원센터의 슬로건은 무엇일까요? \n
              힌트는 공식 인스타그램을 참고해 보세요!`,
          opt: [`정답은 운영진에게 말해주세요`],
          ans: `staff`,
        },
        23: {
          q: `비장애학생은 장애학생지원센터에서 휠체어를 빌릴 수 없다`,
          opt: [`O`, `X`],
          ans: `X`,
        },
        24: {
          q: `장애학생지원센터에는 도우미 제도가 있는데 \n
              도우미 학생은 무료로 봉사를 하는 것이다.`,
          opt: [`O`, `X`],
          ans: `X`,
        },
        25: {
          q: `단국대 장애학생지원센터는 방학 때도 이용할 수 있다.`,
          opt: [`O`, `X`],
          ans: `O`,
        },
        26: {
          q: `장애학생지원센터 내에는 휴게실이 있다.`,
          opt: [`O`, `X`],
          ans: `O`,
        },
        27: {
          q: `장애학생지원센터에는 잠시 누워서 쉴 수 있는 침대가 몇 개 있을까요? \n
              힌트는 공식 인스타그램을 참고해 보세요!`,
          opt: [`정답은 운영진에게 말해주세요`],
          ans: `staff`,
        },
        28: {
          q: `장애학생지원센터에서 운영하는 라운지는 \n
              장애학생과 비장애학생 모두 이용 가능하다.`,
          opt: [`O`, `X`],
          ans: `O`,
        },
        29: {
          q: `장애학생지원센터에서 대여해주는 물품(휠체어 등)은 \n
              장애학생만 이용 가능하다.`,
          opt: [`O`, `X`],
          ans: `X`,
        },
        30: {
          q: `단국대학교 장애학생지원센터의 지원 내용이 아닌 것은? \n
              힌트는 공식 인스타그램을 참고해 보세요!`,
          opt: [`대체 자료 제작`, `이동 보조`, `장애인증 발급`, `속기사 지원`],
          ans: `장애인증 발급`,
        },
      };
      const checkLock = () => localStorage.getItem('quiz_completed') === 'true';
      function updateThemeMeta() {
        const meta = document.querySelector('meta[name="theme-color"]');
        if (document.body.classList.contains('dark-mode')) {
          meta.setAttribute('content', '#001f3f');
        } else {
          meta.setAttribute('content', '#b3d9ff');
        }
      }
      function updateGrid() {
        const grid = document.getElementById('card-grid');
        grid.innerHTML = '';
        const isLocked = checkLock();
        for (let i = 1; i <= 30; i++) {
          const card = document.createElement('div');
          card.innerText = i;
          card.className = 'card' + (isLocked ? ' locked' : '');
          card.onclick = () => {
            if (!checkLock()) showQuiz(i);
          };
          grid.appendChild(card);
        }
      }
      updateGrid();
      async function speak(text) {
        window.speechSynthesis.cancel();
        const parts = text.split('\n');
        for (const part of parts) {
          if (!part.trim()) continue;
          await new Promise((resolve) => {
            const utterance = new SpeechSynthesisUtterance(part);
            utterance.lang = 'ko-KR';
            utterance.rate = 1.0;
            utterance.onend = () => setTimeout(resolve, 550);
            window.speechSynthesis.speak(utterance);
          });
        }
      }
      function getQuizType(data) {
        if (data.ans === 'staff') return 'staff';
        if (
          data.opt.length === 2 &&
          data.opt.includes('O') &&
          data.opt.includes('X')
        )
          return 'ox';
        if (data.opt.length >= 2) return 'choice';
        return 'short';
      }
      function getQuizTypeLabel(type) {
        if (type === 'ox') return 'O X 문제입니다.';
        if (type === 'choice') return '선지형 문제입니다.';
        if (type === 'short') return '단답형 문제입니다.';
        return '주관식 문제입니다.';
      }
      /* ★ 인스타 넛지를 보여줄 문항 번호 목록 — 여기서만 번호 추가/제거하면 됩니다 ★ */
      const NUDGE_QUESTIONS = [21, 22, 27, 30];
      function setNudge(active) {
        const footer = document.querySelector('.footer');
        if (active) {
          footer.classList.add('nudging');
        } else {
          footer.classList.remove('nudging');
        }
      }
      function showQuiz(num) {
        const data = quizData[num] || {
          q: `${num}번 준비 중!`,
          opt: [`확인`],
          ans: `확인`,
        };
        currentQuizType = data.ans;
        if (data.ans === 'staff') {
          solveTime = Date.now();
          localStorage.setItem('quiz_completed', 'true');
        } else {
          solveTime = null;
        }
        document.getElementById('main-page').style.display = 'none';
        document.getElementById('quiz-page').style.display = 'block';
        document.getElementById('quiz-title').innerText = `${num}번 문제`;
        document.getElementById('question-text').innerText = data.q;
        const optGrid = document.getElementById('options-grid');
        optGrid.innerHTML = '';
        optGrid.style.pointerEvents = 'auto';
        optGrid.className = data.opt.length <= 2 ? 'layout-row' : 'layout-col';
        data.opt.forEach((o) => {
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.innerText = o;
          if (o === 'O') btn.classList.add('is-ox', 'btn-o');
          else if (o === 'X') btn.classList.add('is-ox', 'btn-x');
          btn.onclick = () => checkAnswer(num, o, data.ans);
          optGrid.appendChild(btn);
        });
        /* 인스타 넛지 */
        setNudge(NUDGE_QUESTIONS.includes(num));
        /* TTS */
        const qType = getQuizType(data);
        const typeLabel = getQuizTypeLabel(qType);
        (async () => {
          await speak(`${num}번 문제입니다.`);
          await new Promise((r) => setTimeout(r, 300));
          await speak(typeLabel);
          await speak(data.q);
          if (qType === 'choice') {
            const realOpts = data.opt.filter(
              (o) =>
                !o.includes('인스타그램') &&
                !o.includes('Instagram') &&
                !o.includes('instagram') &&
                !o.includes('운영진'),
            );
            if (realOpts.length > 0) {
              await speak('보기입니다.');
              for (let i = 0; i < realOpts.length; i++) {
                await speak(`${i + 1}번. ${realOpts[i]}`);
              }
            }
          }
        })();
      }
      function checkAnswer(num, userAns, correctAns) {
        if (correctAns !== 'staff') {
          localStorage.setItem('quiz_completed', 'true');
        }
        const msg = document.getElementById('result-msg');
        msg.innerHTML = '';
        if (correctAns !== 'staff') {
          window.speechSynthesis.cancel();
          if (userAns === correctAns) {
            msg.innerHTML =
              "<span style='color: #27ae60;'>정답입니다! 🎉</span>";
            startCelebration();
          } else {
            msg.innerHTML =
              "<span style='color: #e74c3c;'>아쉽네요! 다음에 다시 도전해주세요</span>";
            playWrongSound();
          }
        }
        document.getElementById('options-grid').style.pointerEvents = 'none';
      }
      function goBack() {
        window.speechSynthesis.cancel();
        if (currentQuizType === 'staff' && solveTime !== null) {
          if (Date.now() - solveTime < 10000) {
            localStorage.removeItem('quiz_completed');
          }
        }
        setNudge(false);
        document.getElementById('main-page').style.display = 'block';
        document.getElementById('quiz-page').style.display = 'none';
        document.getElementById('result-msg').innerHTML = '';
        solveTime = null;
        updateGrid();
      }
      /* ── 폭죽 이펙트 (골드 에디션) ── */
      const confettiCanvas = document.getElementById('confetti-canvas');
      const confettiCtx = confettiCanvas.getContext('2d', { alpha: true });
      let confettiParticles = [];
      let confettiAnimating = false;
      function resizeConfetti() {
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeConfetti);
      resizeConfetti();

      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      function playDingDongDang() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const notes = [523.25, 659.25, 783.99];
        notes.forEach((freq, i) => {
          const startTime = now + i * 0.22;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0, startTime);
          gain.gain.linearRampToValueAtTime(0.28, startTime + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.4);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.5);
        });
      }
      function playWrongSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        [0, 0.13].forEach((offset) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(880, now + offset);
          osc.frequency.linearRampToValueAtTime(440, now + offset + 0.1);
          gain.gain.setValueAtTime(0.45, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.12);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.13);
        });
      }

      class ConfettiParticle {
        constructor(x, y, color) {
          this.x = x;
          this.y = y;
          this.color = color;
          const angle = Math.random() * Math.PI * 2;
          const force = Math.random() * 8 + 3;
          this.vx = Math.cos(angle) * force;
          this.vy = Math.sin(angle) * force;
          this.friction = 0.96;
          this.gravity = 0.09;
          this.alpha = 1;
          this.decay = Math.random() * 0.008 + 0.006;
          this.history = [];
          this.maxHistory = 20;
        }
        update() {
          this.vx *= this.friction;
          this.vy *= this.friction;
          this.vy += this.gravity;
          this.x += this.vx;
          this.y += this.vy;
          this.alpha -= this.decay;
          this.history.push({ x: this.x, y: this.y });
          if (this.history.length > this.maxHistory) this.history.shift();
        }
        draw() {
          const h = this.history;
          const len = h.length;
          if (len < 2) return;
          confettiCtx.globalAlpha = this.alpha > 0 ? this.alpha : 0;
          confettiCtx.globalCompositeOperation = 'multiply';
          confettiCtx.beginPath();
          confettiCtx.moveTo(h[0].x, h[0].y);
          for (let i = 1; i < len; i++) {
            confettiCtx.lineTo(h[i].x, h[i].y);
          }
          confettiCtx.strokeStyle = this.color;
          confettiCtx.lineWidth = 2.5;
          confettiCtx.lineCap = 'round';
          confettiCtx.stroke();
          if (this.alpha > 0.4) {
            confettiCtx.globalCompositeOperation = 'lighter';
            confettiCtx.fillStyle = '#fff';
            if (this.alpha > 0.6) {
              confettiCtx.shadowBlur = 4;
              confettiCtx.shadowColor = this.color;
            }
            confettiCtx.fillRect(this.x - 1.2, this.y - 1.2, 2.4, 2.4);
            confettiCtx.shadowBlur = 0;
          }
        }
      }
      function createBurst() {
        const x =
          Math.random() * (confettiCanvas.width * 0.8) +
          confettiCanvas.width * 0.1;
        const y = Math.random() * (confettiCanvas.height * 0.4) + 120;
        const colors = [
          '#FFD700',
          '#F7E7CE',
          '#FFDF00',
          '#FFF5EE',
          '#FFC0CB',
          '#FFFFFF',
        ];
        const color = colors[Math.floor(Math.random() * colors.length)];
        for (let i = 0; i < 90; i++) {
          confettiParticles.push(new ConfettiParticle(x, y, color));
        }
      }
      function animateConfetti() {
        confettiAnimating = true;
        confettiCtx.globalCompositeOperation = 'source-over';
        confettiCtx.globalAlpha = 0.18;
        confettiCtx.clearRect(
          0,
          0,
          confettiCanvas.width,
          confettiCanvas.height,
        );
        confettiCtx.globalAlpha = 1;
        for (let i = confettiParticles.length - 1; i >= 0; i--) {
          const p = confettiParticles[i];
          p.update();
          if (p.alpha <= 0) {
            confettiParticles.splice(i, 1);
          } else {
            p.draw();
          }
        }
        if (confettiParticles.length > 0) {
          requestAnimationFrame(animateConfetti);
        } else {
          confettiAnimating = false;
          confettiCtx.clearRect(
            0,
            0,
            confettiCanvas.width,
            confettiCanvas.height,
          );
        }
      }
      function startCelebration() {
        playDingDongDang();
        let burstCount = 0;
        const interval = setInterval(() => {
          createBurst();
          burstCount++;
          if (burstCount >= 8) clearInterval(interval);
          if (!confettiAnimating) animateConfetti();
        }, 220);
      }
      /* ── 폭죽 이펙트 끝 ── */
      let themeClicks = 0;
      function handleThemeClick() {
        const btn = document.getElementById('themeBtn');
        btn.classList.remove('active');
        void btn.offsetWidth;
        btn.classList.add('active');
        setTimeout(() => {
          btn.classList.remove('active');
        }, 550);
        themeClicks++;
        if (themeClicks === 1) {
          document.body.classList.toggle('dark-mode');
          document.documentElement.classList.toggle('dark-mode');
          updateThemeMeta();
          setTimeout(() => {
            themeClicks = 0;
          }, 600);
        }
        if (themeClicks >= 3) {
          localStorage.removeItem('quiz_completed');
          alert('관리자 모드: 리셋되었습니다.');
          location.reload();
        }
      }
      /* iOS 바운스 스크롤 방지 */
      document.addEventListener(
        'touchmove',
        function (e) {
          e.preventDefault();
        },
        { passive: false },
      );
      updateThemeMeta();
    </script>
  </body>
</html>
