<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <!-- 모바일 주소창 / 탭 컬러 통일 -->
    <meta name="theme-color" content="#b3d9ff" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <link rel="icon" href="Logo-dssc.png" type="image/png" />
    <title>퀴즈 Time!</title>

    <style>
      :root {
        --bg-main: linear-gradient(180deg, #b3d9ff 0%, #d9ecff 100%);
        --bg-solid: #b3d9ff;

        --container-bg: rgba(255, 255, 255, 0.4);
        --text-color: #2c3e50;

        --glass-white: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(255, 255, 255, 0.5);
        --glass-shadow: rgba(0, 0, 0, 0.05);

        --glass-green: rgba(52, 199, 89, 0.85);
        --glass-red: rgba(255, 59, 48, 0.85);

        /* 목록으로 돌아가기 버튼 */
        --back-btn-bg: #2c3e50;
        --back-btn-text: #ffffff;

        /* 달 아이콘 */
        --moon-color: #0a84ff;
      }

      body.dark-mode {
        --bg-main: linear-gradient(180deg, #001f3f 0%, #1a1a1a 100%);
        --bg-solid: #001f3f;

        --container-bg: rgba(0, 0, 0, 0.5);
        --text-color: #ffffff;

        --glass-white: rgba(255, 255, 255, 0.15);
        --glass-border: rgba(255, 255, 255, 0.1);

        /* 저시력 가독성 고려 */
        --back-btn-bg: #7da8d6;
        --back-btn-text: #0f1720;

        /* 개나리 느낌 노랑 */
        --moon-color: #ffd93b;
      }

      /* 전체 스크롤 제거 + 상하단 배경 연결 */
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: auto;
        touch-action: manipulation;
        background: var(--bg-solid);
      }

      body {
        font-family: 'Pretendard', sans-serif;
        text-align: center;

        background:
          linear-gradient(
            to bottom,
            var(--bg-solid) 0%,
            var(--bg-solid) 8%,
            transparent 18%,
            transparent 82%,
            var(--bg-solid) 92%,
            var(--bg-solid) 100%
          ),
          var(--bg-main);

        background-attachment: fixed;
        background-repeat: no-repeat;
        background-size: cover;

        color: var(--text-color);

        margin: 0;

        min-height: 100dvh;
        height: 100dvh;

        padding: env(safe-area-inset-top) 20px
          calc(env(safe-area-inset-bottom) + 120px) 20px;

        box-sizing: border-box;

        transition:
          background 0.6s ease,
          color 0.4s ease;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        width: 100%;
        max-width: 850px;

        max-height: calc(100dvh - 40px);

        overflow: hidden;

        margin: 0 auto;

        background: var(--container-bg);

        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);

        padding: 30px 20px;

        border-radius: 40px;

        border: 1px solid rgba(255, 255, 255, 0.3);

        box-shadow: 0 25px 50px var(--glass-shadow);

        box-sizing: border-box;
      }

      .grid {
        display: grid;
        gap: 12px;
        margin-top: 30px;
        grid-template-columns: repeat(8, 1fr);
      }

      @media (max-width: 768px) {
        .grid {
          grid-template-columns: repeat(5, 1fr);
        }

        .container {
          padding: 24px 16px;
          border-radius: 30px;
        }

        #question-text {
          font-size: 1.25rem !important;
        }

        .opt-btn {
          font-size: 1rem !important;
          padding: 16px !important;
        }

        .bottom-bar {
          bottom: 18px !important;
        }
      }

      .card {
        aspect-ratio: 1 / 1;

        display: flex;
        align-items: center;
        justify-content: center;

        background: var(--glass-white);

        border: 1px solid var(--glass-border);

        border-radius: 18px;

        font-size: 1.2rem;
        font-weight: 800;

        cursor: pointer;

        box-shadow: 0 5px 15px var(--glass-shadow);

        transition:
          transform 0.2s,
          background 0.4s;

        -webkit-tap-highlight-color: transparent;
      }

      .card:active {
        transform: scale(0.94);
      }

      .card.locked {
        opacity: 0.2;
        filter: grayscale(1);
        pointer-events: none;
      }

      .card.admin-gate {
        opacity: 1 !important;
        filter: none !important;
        pointer-events: auto !important;
      }

      #question-text {
        font-size: 1.5rem;
        margin: 30px 0;
        font-weight: 800;
        line-height: 1.6;
        word-break: keep-all;
        white-space: pre-line;
      }

      #options-grid {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin: 25px auto;
        width: 100%;
      }

      .layout-row {
        flex-direction: row;
      }

      .layout-col {
        flex-direction: column;
      }

      .opt-btn {
        padding: 18px;

        border-radius: 20px;

        border: 1px solid var(--glass-border);

        background: var(--glass-white);

        color: var(--text-color);

        font-size: 1.2rem;
        font-weight: 800;

        cursor: pointer;

        position: relative;
        overflow: hidden;

        transition:
          transform 0.18s ease,
          opacity 0.25s ease,
          background 0.4s;

        -webkit-tap-highlight-color: transparent;
      }

      .opt-btn:active {
        transform: scale(0.96);
      }

      .opt-btn.btn-o {
        background: var(--glass-green);
        color: white;
      }

      .opt-btn.btn-x {
        background: var(--glass-red);
        color: white;
      }

      .opt-btn.is-ox {
        aspect-ratio: 1 / 1;
        max-width: 120px;
        font-size: 2.2rem;
        flex: 1;
      }

      /* 목록으로 돌아가기 버튼 */
      .back-btn {
        margin-top: 40px;
        padding: 15px 50px;

        border-radius: 20px;
        border: none;

        background: var(--back-btn-bg);
        color: var(--back-btn-text);

        font-weight: 800;

        cursor: pointer;

        transition:
          background 0.4s ease,
          color 0.4s ease,
          transform 0.2s ease;
      }

      .back-btn:active {
        transform: scale(0.96);
      }

      /* 푸터 다이나믹 아일랜드 스타일 */
      .bottom-bar {
        position: fixed;

        bottom: 30px;
        left: 50%;

        transform: translateX(-50%);

        display: flex;
        align-items: center;

        gap: 10px;

        z-index: 2000;
      }

      .footer {
        display: flex;
        align-items: center;

        gap: 8px;

        padding: 12px 22px;

        background: var(--glass-white);

        backdrop-filter: blur(15px);

        border-radius: 50px;

        border: 1px solid var(--glass-border);

        text-decoration: none;

        color: var(--text-color);

        white-space: nowrap;

        transition:
          transform 0.2s ease,
          background 0.4s;

        -webkit-tap-highlight-color: transparent;
      }

      .footer:active {
        transform: scale(0.94);
      }

      .footer span {
        font-weight: 800;
        font-size: 0.9rem;
        letter-spacing: -0.5px;
      }

      .theme-toggle {
        width: 50px;
        height: 50px;

        border-radius: 50%;

        background: var(--glass-white);

        backdrop-filter: blur(15px);

        border: 1px solid var(--glass-border);

        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;

        transition:
          transform 0.45s cubic-bezier(0.4, 0, 0.2, 1),
          background 0.4s,
          opacity 0.2s;

        will-change: transform;

        -webkit-tap-highlight-color: transparent;
      }

      .theme-toggle svg {
        transition:
          transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
          opacity 0.3s ease,
          fill 0.4s ease;

        will-change: transform;

        fill: var(--moon-color);
      }

      /* 모바일에서도 확실하게 동작 */
      .theme-toggle.active {
        transform: scale(0.88);
      }

      .theme-toggle.active svg {
        transform: rotate(360deg) scale(1.25);
      }

      #quiz-page {
        display: none;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div id="main-page">
        <h1 style="font-weight: 900; letter-spacing: -1.5px; font-size: 1.8rem">
          뽑기에서 나온 번호에 맞는 숫자를 선택해주세요!
        </h1>

        <div class="grid" id="card-grid"></div>
      </div>

      <div id="quiz-page">
        <h1 id="quiz-title" style="font-size: 1rem; opacity: 0.6"></h1>

        <div id="question-text"></div>

        <div id="options-grid"></div>

        <div
          id="result-msg"
          style="margin-top: 25px; font-size: 1.5rem; font-weight: 900"
        ></div>

        <button onclick="goBack()" class="back-btn">목록으로 돌아가기</button>
      </div>
    </div>

    <div class="bottom-bar">
      <a
        href="https://www.instagram.com/dku_dssc"
        target="_blank"
        class="footer"
      >
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">

        <span>단국대 장애학생지원센터</span>
      </a>

      <button class="theme-toggle" onclick="handleThemeClick()" id="themeBtn">
        <svg viewBox="0 0 24 24" width="24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>

      </button>
    </div>

    <script>
      let solveTime = null;
      let currentQuizType = null;

      const quizData = {
        1: {
          q: `모든 시각장애인은 전혀 보지 못한다.`,
          opt: [`O`, `X`],
          ans: `X`,
        },
        2: {
          q: `시각장애인 동기와 점심을 먹으러 학생식당으로 이동합니다. \n
              같이 걸어갈 때 팔을 잡고 걸을 수 있도록 도움을 주어야 하는데 \n
              시각장애인 동기의 오른쪽과 왼쪽 중 어느 쪽에서 걸어가는 것이 좋을까요?`,
          opt: [`정답은 운영진에게 말해주세요`],
          ans: `staff`,
        },

        3: {
          q: `차도와 인도가 나란히 있는 길에서 시각장애인과 동행하는 경우 \n
              안내자는 시각장애인의 오른쪽과 왼쪽 중 어느 쪽에서 걸어가는 것이 좋을까요?`,
          opt: [`정답은 운영진에게 말해주세요`],
          ans: `staff`,
        },

        4: {
          q: `시각장애인 동기와 함께 걸을 때 어떻게 하는 것이 가장 좋은 방법일까요?`,
          opt: [
            `시각장애인 동기의 팔짱을 낀다.`,
            `시각장애인 동기의 손을 잡고 걷는다.`,
            `시각장애인 동기가 안내자의 팔꿈치를 잡도록 한다.`,
            `위험하니까 잡지 않고 나란히 걷는다.`,
          ],
          ans: `시각장애인 동기가 안내자의 팔꿈치를 잡도록 한다.`,
        },

        5: {
          q: `시각장애인이 보행 시 사용하는 지팡이(보조기구)의 올바른 명칭은?`,
          opt: [`정답은 운영진에게 말해주세요`],
          ans: `staff`,
        },

        6: {
          q: `청각장애인이 주로 사용하는 의사소통 방식은 수어이다.`,
          opt: [`O`, `X`],
          ans: `X`,
        },

        7: {
          q: `청각장애인 동기와 대화를 할 때 필요한 에티켓에는 무엇이 있을까요?`,
          opt: [`정답은 운영진에게 말해주세요`],
          ans: `staff`,
        },

        8: {
          q: `시끄러운 곳에서는 청각장애인 동기에게 무조건 크게 말해주어야 한다. \n
              그래야 더 잘들을 수 있다.`,
          opt: [`O`, `X`],
          ans: `X`,
        },

        9: {
          q: `청각장애인 동기와 학생 식당에서 대화하는데 너무 시끄러워서 잘 듣지를 못합니다. \n
              대화 말을 하면서 음성과 문자를 동시에 제시해 주면 좋은데 \n
              이때 가장 손쉽게 활용할 수 있는 기기는 무엇일까요?`,
          opt: [`정답은 운영진에게 말해주세요`],
          ans: `staff`,
        },

        10: {
          q: `청각장애인 동기와 녹강(녹화강의) 수업을 어떻게 들을 수 있을까요?`,
          opt: [`정답은 운영진에게 말해주세요`],
          ans: `staff`,
        },

        11: {
          q: `지체장애인은 무조건 휠체어를 사용한다.`,
          opt: [`O`, `X`],
          ans: `X`,
        },

        12: {
          q: `혜당관(학생회관) 1층에는 배리어프리 키오스크가 몇 개 있을까요?`,
          opt: [`정답은 운영진에게 말해주세요`],
          ans: `staff`,
        },

        13: {
          q: `자체장애인 동기와 계단을 내려갈 때는 반드시 잡아줘야 한다.`,
          opt: [`O`, `X`],
          ans: `X`,
        },

        14: {
          q: `엘리베이터를 타고 있는데 휠체어를 타고 있는 지체장애인이 있다면 \n
              엘리베이터 안에 있는 비장애인은 다 내려서 양보해야 한다.`,
          opt: [`O`, `X`],
          ans: `X`,
        },

        15: {
          q: `단국대에서 휠체어를 탄 지체장애인이 가장 가기 힘든 길은?`,
          opt: [
            `내리막길`,
            `오르막길`,
            `턱이 있는 길`,
            `정답은 운영진에게 말해주세요`,
          ],
          ans: `staff`,
        },

        16: {
          q: `시각, 청각, 언어 장애를 가지고 있으면서도 장애인 인권운동 등을 \n
              이끌었던 미국의 사회 운동가는 누구인가요?`,
          opt: [`정답은 운영진에게 말해주세요`],
          ans: `staff`,
        },

        17: {
          q: `우리 학교 학생 식당에는 휠체어석이 몇 개 있을까요?`,
          opt: [`정답은 운영진에게 말해주세요`],
          ans: `staff`,
        },

        18: {
          q: `학생 식당에는 점심시간에 도움을 줄 수 있는 도우미 학생이 배치되어 있다.`,
          opt: [`O`, `X`],
          ans: `O`,
        },

        19: {
          q: `다음은 사범대 2층 사진입니다. \n무엇이 문제일까요?`,
          opt: [
            `사진은 테이블을 참고해 주세요`,
            `정답은 운영진에게 말해주세요`,
          ],
          ans: `staff`,
        },

        20: {
          q: `장애학생은 비장애학생에게 도움을 줄 수 없다.`,
          opt: [`O`, `X`],
          ans: `X`,
        },

        21: {
          q: `우리 학교 장애학생지원센터는 어디에 있을까요?`,
          opt: [`혜당관 410호`, `혜당관 412호`, `혜당관 414호`, `혜당관 416호`],
          ans: `혜당관 412호`,
        },

        22: {
          q: `장애학생지원센터의 슬로건은 무엇일까요?`,
          opt: [
            `힌트는 공식 인스타그램을 참고해 보세요!`,
            `정답은 운영진에게 말해주세요`,
          ],
          ans: `staff`,
        },

        23: {
          q: `비장애학생은 장애학생지원센터에서 휠체어를 빌릴 수 없다`,
          opt: [`O`, `X`],
          ans: `X`,
        },

        24: {
          q: `장애학생지원센터에는 도우미 제도가 있는데 \n
              도우미 학생은 무료로 봉사를 하는 것이다.`,
          opt: [`O`, `X`],
          ans: `X`,
        },

        25: {
          q: `단국대 장애학생지원센터는 방학 때도 이용할 수 있다.`,
          opt: [`O`, `X`],
          ans: `O`,
        },

        26: {
          q: `장애학생지원센터 내에는 휴개실이 있다.`,
          opt: [`O`, `X`],
          ans: `O`,
        },

        27: {
          q: `장애학생지원센터에는 잠시 누워서 쉴 수 있는 침대가 몇 개 있을까요?`,
          opt: [
            `힌트는 공식 인스타그램을 참고해 보세요!`,
            `정답은 운영진에게 말해주세요`,
          ],
          ans: `staff`,
        },

        28: {
          q: `장애학생지원센터에서 운영하는 라운지는 \n
              장애학생과 비장애학생 모두 이용 가능하다.`,
          opt: [`O`, `X`],
          ans: `O`,
        },

        29: {
          q: `장애학생지원센터에서 대여해주는 물품(휠체어 등)은 \n
              장애학생만 이용 가능하다.`,
          opt: [`O`, `X`],
          ans: `X`,
        },

        30: {
          q: `관리자 모드: 초기화하시겠습니까?`,
          opt: [`리셋하기`, `취소`],
          ans: `리셋하기`,
        },
      };

      const checkLock = () => localStorage.getItem('quiz_completed') === 'true';

      function updateThemeMeta() {
        const meta = document.querySelector('meta[name="theme-color"]');

        if (document.body.classList.contains('dark-mode')) {
          meta.setAttribute('content', '#001f3f');
        } else {
          meta.setAttribute('content', '#b3d9ff');
        }
      }

      function updateGrid() {
        const grid = document.getElementById('card-grid');

        grid.innerHTML = '';

        const isLocked = checkLock();

        for (let i = 1; i <= 30; i++) {
          const card = document.createElement('div');

          card.innerText = i;

          card.className =
            'card' +
            (isLocked ? ' locked' : '') +
            (i === 30 ? ' admin-gate' : '');

          card.onclick = () => {
            if (i === 30) {
              if (confirm('모든 기록을 리셋할까요?')) {
                localStorage.removeItem('quiz_completed');
                location.reload();
              }

              return;
            }

            if (!checkLock()) showQuiz(i);
          };

          grid.appendChild(card);
        }
      }

      updateGrid();

      async function speak(text) {
        window.speechSynthesis.cancel();

        const parts = text.split('\n');

        for (const part of parts) {
          if (!part.trim()) continue;

          await new Promise((resolve) => {
            const utterance = new SpeechSynthesisUtterance(part);

            utterance.lang = 'ko-KR';

            utterance.rate = 1.0;

            utterance.onend = () => setTimeout(resolve, 550);

            window.speechSynthesis.speak(utterance);
          });
        }
      }

      function showQuiz(num) {
        const data = quizData[num] || {
          q: `${num}번 준비 중!`,
          opt: [`확인`],
          ans: `확인`,
        };

        currentQuizType = data.ans;

        if (data.ans === 'staff') {
          solveTime = Date.now();

          localStorage.setItem('quiz_completed', 'true');
        } else {
          solveTime = null;
        }

        document.getElementById('main-page').style.display = 'none';

        document.getElementById('quiz-page').style.display = 'block';

        document.getElementById('quiz-title').innerText = `${num}번 문제`;

        document.getElementById('question-text').innerText = data.q;

        const optGrid = document.getElementById('options-grid');

        optGrid.innerHTML = '';

        optGrid.style.pointerEvents = 'auto';

        optGrid.className = data.opt.length <= 2 ? 'layout-row' : 'layout-col';

        data.opt.forEach((o) => {
          const btn = document.createElement('button');

          btn.className = 'opt-btn';

          btn.innerText = o;

          if (o === 'O') btn.classList.add('is-ox', 'btn-o');
          else if (o === 'X') btn.classList.add('is-ox', 'btn-x');

          btn.onclick = () => checkAnswer(num, o, data.ans);

          optGrid.appendChild(btn);
        });

        speak(`${num}번 문제입니다. \n ${data.q}`);
      }

      function checkAnswer(num, userAns, correctAns) {
        if (correctAns !== 'staff') {
          localStorage.setItem('quiz_completed', 'true');
        }

        const msg = document.getElementById('result-msg');

        msg.innerHTML = '';

        if (correctAns !== 'staff') {
          if (userAns === correctAns) {
            msg.innerHTML =
              "<span style='color: #27ae60;'>정답입니다! 🎉</span>";

            fireConfetti();
          } else {
            msg.innerHTML =
              "<span style='color: #e74c3c;'>아쉽네요! 다음에 다시 도전해주세요</span>";
          }
        }

        document.getElementById('options-grid').style.pointerEvents = 'none';
      }

      function goBack() {
        window.speechSynthesis.cancel();

        if (currentQuizType === 'staff' && solveTime !== null) {
          if (Date.now() - solveTime < 10000) {
            localStorage.removeItem('quiz_completed');
          }
        }

        document.getElementById('main-page').style.display = 'block';

        document.getElementById('quiz-page').style.display = 'none';

        document.getElementById('result-msg').innerHTML = '';

        solveTime = null;

        updateGrid();
      }

      function fireConfetti() {
        const emojis = ['🎉', '🎊', '✨', '🎈', '⭐'];

        for (let i = 0; i < 40; i++) {
          const c = document.createElement('div');

          c.style.position = 'fixed';

          c.innerText = emojis[Math.floor(Math.random() * emojis.length)];

          c.style.left = Math.random() * 100 + 'vw';

          c.style.top = '-50px';

          c.style.fontSize = '40px';

          c.style.zIndex = '3000';

          c.style.transition = `all ${Math.random() * 2 + 2}s linear`;

          document.body.appendChild(c);

          setTimeout(() => {
            c.style.top = '110vh';

            c.style.transform = `rotate(${Math.random() * 360}deg)`;
          }, 50);

          setTimeout(() => c.remove(), 4000);
        }
      }

      let themeClicks = 0;

      function handleThemeClick() {
        const btn = document.getElementById('themeBtn');

        btn.classList.remove('active');

        void btn.offsetWidth;

        btn.classList.add('active');

        setTimeout(() => {
          btn.classList.remove('active');
        }, 550);

        themeClicks++;

        if (themeClicks === 1) {
          document.body.classList.toggle('dark-mode');

          updateThemeMeta();

          setTimeout(() => {
            themeClicks = 0;
          }, 600);
        }

        if (themeClicks >= 3) {
          localStorage.removeItem('quiz_completed');

          alert('관리자 모드: 리셋되었습니다.');

          location.reload();
        }
      }

      /* iOS 바운스 스크롤 방지 */
      document.addEventListener(
        'touchmove',
        function (e) {
          e.preventDefault();
        },
        { passive: false },
      );

      updateThemeMeta();
    </script>
  </body>
</html>
