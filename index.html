<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="Logo-dssc.png" type="image/png" />
    <title>32 숫자 퀴즈</title>
    <style>
      :root {
        --bg-color: #ffffff;
        --container-bg: rgba(255, 255, 255, 0.4);
        --text-color: #1d1d1f;
        --card-bg: rgba(255, 255, 255, 0.6);
        --card-shadow: rgba(0, 0, 0, 0.08);
        --accent-color: #007aff;
        --moon-color: #000000;
        --toggle-bg: #ffffff;
      }

      body.dark-mode {
        --bg-color: #121212;
        --container-bg: rgba(30, 30, 30, 0.4);
        --text-color: #f5f5f7;
        --card-bg: rgba(255, 255, 255, 0.1);
        --card-shadow: rgba(0, 0, 0, 0.4);
        --accent-color: #0a84ff;
        --moon-color: #ffffff;
        --toggle-bg: #2c2c2e;
      }

      body {
        font-family:
          'Pretendard',
          -apple-system,
          sans-serif;
        text-align: center;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: env(safe-area-inset-top) 20px;
        transition:
          background-color 0.5s ease,
          color 0.5s ease;
      }

      .container {
        max-width: 800px;
        margin: 60px auto;
        background: var(--container-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 40px 20px;
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 10px 40px var(--card-shadow);
      }

      /* 업그레이드된 원형 초승달 버튼 */
      .theme-toggle {
        position: fixed;
        top: 25px;
        right: 25px;
        width: 60px; /* 크기 키움 */
        height: 60px;
        border-radius: 50%; /* 완전한 원형 */
        background: var(--toggle-bg);
        border: none;
        cursor: pointer;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15); /* Off 시 가시성을 위한 그림자 */
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .theme-toggle svg {
        width: 28px;
        height: 28px;
        fill: var(--moon-color);
        transition: fill 0.3s ease;
      }

      .theme-toggle:active {
        transform: scale(0.9);
      }

      .grid {
        display: grid;
        gap: 12px;
        margin-top: 30px;
        grid-template-columns: repeat(8, 1fr);
      }

      @media (max-width: 600px) {
        .grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      .card {
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--card-bg);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 18px;
        font-size: 1.2rem;
        font-weight: 600;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        box-shadow: 0 4px 12px var(--card-shadow);
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 50%;
        background: linear-gradient(
          rgba(255, 255, 255, 0.25),
          rgba(255, 255, 255, 0)
        );
      }

      .card:active {
        transform: scale(0.88);
        filter: brightness(0.9);
      }

      .question-box {
        font-size: 1.5rem;
        line-height: 1.8;
        margin: 40px 0;
        color: var(--accent-color);
        white-space: pre-wrap;
        word-break: keep-all;
        font-weight: 500;
      }

      .btn-back {
        padding: 15px 45px;
        border-radius: 20px;
        border: none;
        background: var(--text-color);
        color: var(--bg-color);
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- 얇은 초승달 SVG가 적용된 원형 버튼 -->
    <button class="theme-toggle" onclick="toggleTheme()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M12.1,22c-4.9,0-9-3.8-9.1-8.7c0-3.1,1.5-6.1,4.1-8c0.4-0.3,0.9-0.1,1,0.3c0.1,0.4-0.1,0.9-0.5,1.1c-2,1.5-3.1,3.8-3.1,6.3c0.1,3.8,3.2,6.9,7.1,6.9c2.1,0,4.1-0.9,5.5-2.5c0.3-0.3,0.8-0.4,1.1-0.1c0.3,0.3,0.4,0.8,0.1,1.1C16.8,20.6,14.5,22,12.1,22z"
        />
      </svg>
    </button>

    <div class="container">
      <div id="main-page">
        <h1 style="font-weight: 800; letter-spacing: -1.5px">
          번호를 골라주세요!
        </h1>
        <div class="grid" id="card-grid"></div>
      </div>

      <div id="quiz-page">
        <h1 id="quiz-title" style="font-size: 1.1rem; opacity: 0.5">
          0번 문제
        </h1>
        <div class="question-box" id="question-text"></div>
        <button class="btn-back" onclick="goBack()">뒤로 가기</button>
      </div>
    </div>

    <script>
      const grid = document.getElementById('card-grid');
      for (let i = 1; i <= 32; i++) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerText = i;
        card.onclick = () => showQuiz(i);
        grid.appendChild(card);
      }

      const quizData = {
        1: `모든 시각장애인은 전혀 보지 못한다. \n O/X`,
        2: `시각장애인 동기와 점심을 먹으러 학생식당으로 이동합니다. \n같이 걸어갈 때 팔을 잡고 걸을 수 있도록 도움을 주어야 하는데 \n시각장애인 동기의 오른쪽과 왼쪽 중 어느 쪽에서 걸어가는 것이 좋을까요?`,
        3: `차도와 인도가 나란히 있는 길에서 시각장애인과 동행하는 경우 \n안내자는 시각장애인의 오른쪽과 왼쪽 중 어느 쪽에서 걸어가는 것이 좋을까요?`,
        32: '마지막 문제입니다. 화이팅!',
      };

      // 개선된 TTS: 줄바꿈 시 잠깐 휴지(Pause) 추가
      function speak(text) {
        window.speechSynthesis.cancel();

        // \n을 마침표나 쉼표로 치환하면 TTS 엔진이 자연스럽게 숨을 고릅니다.
        const pausedText = text.replace(/\n/g, ', ... ');

        const utterance = new SpeechSynthesisUtterance(pausedText);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.9; // 약간 천천히 읽어 가독성 향상
        window.speechSynthesis.speak(utterance);
      }

      function showQuiz(num) {
        const question = quizData[num] || '문제가 아직 등록되지 않았습니다.';
        document.getElementById('main-page').style.display = 'none';
        document.getElementById('quiz-page').style.display = 'block';
        document.getElementById('quiz-title').innerText = num + '번 문제';
        document.getElementById('question-text').innerText = question;

        const readText = `${num}번 문제입니다. ${question} 정답은 무엇일까요?`;
        speak(readText);
      }

      function goBack() {
        window.speechSynthesis.cancel();
        document.getElementById('main-page').style.display = 'block';
        document.getElementById('quiz-page').style.display = 'none';
      }

      function toggleTheme() {
        document.body.classList.toggle('dark-mode');
      }
    </script>
  </body>
</html>
