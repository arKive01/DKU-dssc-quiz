<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" href="Logo-dssc.png" type="image/png" />
    <meta id="theme-meta" name="theme-color" content="#e0f2ff" />
    <title>퀴즈 Time!</title>
    <style>
      :root {
        --bg-main: linear-gradient(135deg, #e0f2ff 0%, #b3d9ff 100%);
        --bg-solid: #e0f2ff;
        --container-bg: rgba(255, 255, 255, 0.4);
        --text-color: #2c3e50;
        --glass-white: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(255, 255, 255, 0.5);
        --glass-shadow: rgba(0, 0, 0, 0.05);
        --glass-green: rgba(52, 199, 89, 0.85);
        --glass-red: rgba(255, 59, 48, 0.85);
      }
      body.dark-mode {
        --bg-main: linear-gradient(135deg, #1a1a1a 0%, #001f3f 100%);
        --bg-solid: #1a1a1a;
        --container-bg: rgba(0, 0, 0, 0.5);
        --text-color: #ffffff;
        --glass-white: rgba(255, 255, 255, 0.15);
        --glass-border: rgba(255, 255, 255, 0.1);
      }

      /* 모든 요소 클릭 시 발생하는 영역 상자 제거 */
      * {
        -webkit-tap-highlight-color: transparent;
        outline: none !important;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden; /* 스크롤 절대 방지 */
        background-color: var(--bg-solid); /* 시스템 영역 배경 보충 */
      }

      body {
        font-family: 'Pretendard', sans-serif;
        text-align: center;
        background: var(--bg-main);
        background-attachment: fixed;
        color: var(--text-color);
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        transition: background 0.6s ease;
      }

      .container {
        width: 100%;
        max-width: 850px;
        margin-top: 20px;
        background: var(--container-bg);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        padding: 30px 15px;
        border-radius: 40px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 25px 50px var(--glass-shadow);
        max-height: 70vh;
        overflow-y: auto;
      }

      /* 그리드 및 카드 스타일 */
      .grid {
        display: grid;
        gap: 10px;
        margin-top: 25px;
        grid-template-columns: repeat(8, 1fr);
      }
      @media (max-width: 768px) {
        .grid {
          grid-template-columns: repeat(5, 1fr);
        }
      }

      .card {
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--glass-white);
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        font-size: 1.1rem;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.2s;
      }
      .card.locked {
        opacity: 0.2;
        filter: grayscale(1);
        pointer-events: none;
      }
      .card.admin-gate {
        opacity: 1 !important;
        filter: none !important;
        pointer-events: auto !important;
      }

      #question-text {
        font-size: 1.4rem;
        margin: 25px 0;
        font-weight: 800;
        line-height: 1.6;
        word-break: keep-all;
        white-space: pre-line;
      }

      .opt-btn {
        padding: 18px;
        border-radius: 20px;
        border: 1px solid var(--glass-border);
        background: var(--glass-white);
        color: var(--text-color);
        font-size: 1.2rem;
        font-weight: 800;
        cursor: pointer;
      }

      /* 하단 탭바 레이아웃 수정 */
      .bottom-bar {
        position: fixed;
        bottom: 50px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 2000;
      }

      .footer {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 22px;
        height: 54px; /* 버튼 높이 고정 */
        background: var(--glass-white);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-radius: 50px;
        border: 1px solid var(--glass-border);
        text-decoration: none;
        color: var(--text-color);
        white-space: nowrap; /* 글자 한 줄 유지 */
      }
      .footer span {
        font-weight: 800;
        font-size: 0.9rem;
      }

      .theme-toggle {
        width: 54px;
        height: 54px;
        aspect-ratio: 1 / 1; /* 완벽한 원형 유지 */
        flex-shrink: 0;
        border-radius: 50%;
        background: var(--glass-white);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid var(--glass-border);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #quiz-page {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="main-page">
        <h1
          style="
            font-weight: 900;
            letter-spacing: -1.5px;
            font-size: 1.6rem;
            margin: 0;
          "
        >
          뽑기에서 나온 번호에 맞는 숫자를 선택해주세요!
        </h1>
        <div class="grid" id="card-grid"></div>
      </div>

      <div id="quiz-page">
        <h1
          id="quiz-title"
          style="font-size: 0.9rem; opacity: 0.6; margin: 0"
        ></h1>
        <div id="question-text"></div>
        <div
          id="options-grid"
          style="
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 20px auto;
          "
        ></div>
        <div
          id="result-msg"
          style="margin-top: 25px; font-size: 1.5rem; font-weight: 900"
        ></div>
        <button
          onclick="goBack()"
          style="
            margin-top: 30px;
            padding: 15px 50px;
            border-radius: 20px;
            border: none;
            background: var(--text-color);
            color: white;
            font-weight: 800;
            cursor: pointer;
          "
        >
          목록으로 돌아가기
        </button>
      </div>
    </div>

    <div class="bottom-bar">
      <a
        href="https://www.instagram.com/dku_dssc"
        target="_blank"
        class="footer"
      >
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
          <path
            d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.269-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204 013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"
          />
        </svg>
        <span>단국대 장애학생지원센터</span>
      </a>
      <button class="theme-toggle" onclick="handleThemeClick()" id="themeBtn">
        <svg viewBox="0 0 24 24" width="24" fill="currentColor">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>

    <script>
      let solveTime = null;
      // ... (quizData는 이전과 동일) ...
      const quizData = {
        1: {
          q: `모든 시각장애인은 전혀 보지 못한다.`,
          opt: [`O`, `X`],
          ans: `X`,
        },
        2: {
          q: `시각장애인 동기와 점심을 먹으러 학생식당으로 이동합니다. \n 같이 걸어갈 때 팔을 잡고 걸을 수 있도록 도움을 주어야 하는데 \n 시각장애인 동기의 오른쪽과 왼쪽 중 어느 쪽에서 걸어가는 것이 좋을까요?`,
          opt: [`정답은 운영진에게 말해주세요`],
          ans: `staff`,
        },
        // ... (중략) ...
        30: {
          q: `관리자 모드: 초기화하시겠습니까?`,
          opt: [`리셋하기`, `취소`],
          ans: `리셋하기`,
        },
      };

      // [TTS 0.6초 딜레이 조정]
      async function speak(text) {
        window.speechSynthesis.cancel();
        const parts = text.split('\n');
        for (const part of parts) {
          if (!part.trim()) continue;
          await new Promise((resolve) => {
            const utterance = new SpeechSynthesisUtterance(part);
            utterance.lang = 'ko-KR';
            utterance.rate = 1.0;
            utterance.onend = () => setTimeout(resolve, 600); // 0.6초로 변경
            window.speechSynthesis.speak(utterance);
          });
        }
      }

      function updateGrid() {
        const grid = document.getElementById('card-grid');
        grid.innerHTML = '';
        const isLocked = localStorage.getItem('quiz_completed') === 'true';
        for (let i = 1; i <= 30; i++) {
          const card = document.createElement('div');
          card.innerText = i;
          card.className =
            'card' +
            (isLocked ? ' locked' : '') +
            (i === 30 ? ' admin-gate' : '');
          card.onclick = () => {
            if (i === 30) {
              if (confirm('리셋할까요?')) {
                localStorage.removeItem('quiz_completed');
                location.reload();
              }
            } else if (!isLocked) showQuiz(i);
          };
          grid.appendChild(card);
        }
      }

      function showQuiz(num) {
        const data = quizData[num];
        if (data.ans === 'staff') {
          solveTime = Date.now();
          localStorage.setItem('quiz_completed', 'true');
        }
        document.getElementById('main-page').style.display = 'none';
        document.getElementById('quiz-page').style.display = 'block';
        document.getElementById('quiz-title').innerText = `${num}번 문제`;
        document.getElementById('question-text').innerText = data.q;
        const optGrid = document.getElementById('options-grid');
        optGrid.innerHTML = '';
        data.opt.forEach((o) => {
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.innerText = o;
          btn.onclick = () => {
            if (data.ans !== 'staff')
              localStorage.setItem('quiz_completed', 'true');
            if (o === data.ans) {
              document.getElementById('result-msg').innerHTML =
                "<span style='color: #27ae60;'>정답입니다! 🎉</span>";
            } else if (data.ans !== 'staff') {
              document.getElementById('result-msg').innerHTML =
                "<span style='color: #e74c3c;'>아쉽네요!</span>";
            }
          };
          optGrid.appendChild(btn);
        });
        speak(`${num}번 문제입니다. \n ${data.q}`);
      }

      function goBack() {
        window.speechSynthesis.cancel();
        document.getElementById('main-page').style.display = 'block';
        document.getElementById('quiz-page').style.display = 'none';
        updateGrid();
      }

      function handleThemeClick() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        document
          .getElementById('theme-meta')
          .setAttribute('content', isDark ? '#1a1a1a' : '#e0f2ff');
      }

      updateGrid();
    </script>
  </body>
</html>
