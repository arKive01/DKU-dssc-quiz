<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="Logo-dssc.png" type="image/png" />
    <title>32 숫자 퀴즈</title>
    <style>
      :root {
        --bg-color: #ffffff;
        --container-bg: rgba(255, 255, 255, 0.4);
        --text-color: #1d1d1f;
        --card-bg: rgba(255, 255, 255, 0.6);
        --card-shadow: rgba(31, 38, 135, 0.07);
        --accent-color: #007aff;
        --moon-color: #000000;
      }

      /* 다크모드 (On 상태) */
      body.dark-mode {
        --bg-color: #121212;
        --container-bg: rgba(30, 30, 30, 0.4);
        --text-color: #f5f5f7;
        --card-bg: rgba(255, 255, 255, 0.1);
        --card-shadow: rgba(0, 0, 0, 0.3);
        --accent-color: #0a84ff;
        --moon-color: #ffffff;
      }

      body {
        font-family:
          'Pretendard',
          -apple-system,
          sans-serif;
        text-align: center;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: env(safe-area-inset-top) 20px;
        transition:
          background-color 0.5s ease,
          color 0.5s ease;
        overflow-x: hidden;
      }

      /* 리퀴드 글래스 컨테이너 */
      .container {
        max-width: 800px;
        margin: 40px auto;
        background: var(--container-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 40px 20px;
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 32px var(--card-shadow);
      }

      /* 초승달 테마 토글 */
      .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--card-bg);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        cursor: pointer;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
      }
      .theme-toggle svg {
        width: 22px;
        height: 22px;
        fill: var(--moon-color);
        transition: fill 0.3s ease;
      }

      /* 숫자 카드 그리드 (반응형 배열) */
      .grid {
        display: grid;
        gap: 12px;
        margin-top: 30px;
        /* 기본 PC 설정: 8열 (8*4 배열) */
        grid-template-columns: repeat(8, 1fr);
      }

      /* 모바일 설정: 4열 (4*8 배열) */
      @media (max-width: 600px) {
        .grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      /* 리퀴드 글래스 버튼 디자인 */
      .card {
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--card-bg);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 16px;
        font-size: 1.2rem;
        font-weight: 600;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        box-shadow: 0 4px 15px var(--card-shadow);
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* 버튼 광택 효과 (Liquid Glass 핵심) */
      .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 50%;
        background: linear-gradient(
          rgba(255, 255, 255, 0.2),
          rgba(255, 255, 255, 0)
        );
        pointer-events: none;
      }

      /* 쫀득한 반응형 클릭 애니메이션 */
      .card:active {
        transform: scale(0.9);
        filter: brightness(0.9);
        box-shadow: 0 2px 5px var(--card-shadow);
      }

      .card:hover {
        border-color: var(--accent-color);
        background: rgba(0, 122, 255, 0.1);
      }

      #quiz-page {
        display: none;
      }

      .question-box {
        font-size: 1.5rem;
        line-height: 1.7;
        margin: 40px 0;
        color: var(--accent-color);
        white-space: pre-wrap;
        word-break: keep-all;
        font-weight: 500;
      }

      .btn-back {
        padding: 14px 40px;
        border-radius: 18px;
        border: none;
        background: var(--text-color);
        color: var(--bg-color);
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <!-- 초승달 테마 토글 버튼 (SVG 사용) -->
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="테마 전환">
      <svg viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <div class="container">
      <div id="main-page">
        <h1 style="font-weight: 800; letter-spacing: -1px">
          번호를 골라주세요!
        </h1>
        <div class="grid" id="card-grid"></div>
      </div>

      <div id="quiz-page">
        <h1 id="quiz-title" style="font-size: 1.2rem; opacity: 0.6">
          0번 문제
        </h1>
        <div class="question-box" id="question-text"></div>
        <button class="btn-back" onclick="goBack()">뒤로 가기</button>
      </div>
    </div>

    <script>
      const grid = document.getElementById('card-grid');
      for (let i = 1; i <= 32; i++) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerText = i;
        card.onclick = () => showQuiz(i);
        grid.appendChild(card);
      }

      const quizData = {
        1: `모든 시각장애인은 전혀 보지 못한다. \n O/X`,
        2: `시각장애인 동기와 점심을 먹으러 학생식당으로 이동합니다. \n같이 걸어갈 때 팔을 잡고 걸을 수 있도록 도움을 주어야 하는데 \n시각장애인 동기의 오른쪽과 왼쪽 중 어느 쪽에서 걸어가는 것이 좋을까요?`,
        3: `차도와 인도가 나란히 있는 길에서 시각장애인과 동행하는 경우 \n안내자는 시각장애인의 오른쪽과 왼쪽 중 어느 쪽에서 걸어가는 것이 좋을까요?`,
        32: '마지막 문제입니다. 화이팅!',
      };

      function speak(text) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }

      function showQuiz(num) {
        const question = quizData[num] || '문제가 아직 등록되지 않았습니다.';
        document.getElementById('main-page').style.display = 'none';
        document.getElementById('quiz-page').style.display = 'block';
        document.getElementById('quiz-title').innerText = num + '번 문제';
        document.getElementById('question-text').innerText = question;

        const readText = `${num}번 문제입니다. ${question} 정답은 무엇일까요?`;
        speak(readText);
      }

      function goBack() {
        window.speechSynthesis.cancel();
        document.getElementById('main-page').style.display = 'block';
        document.getElementById('quiz-page').style.display = 'none';
      }

      function toggleTheme() {
        document.body.classList.toggle('dark-mode');
      }
    </script>
  </body>
</html>
