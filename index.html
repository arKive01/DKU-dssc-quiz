<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="Logo-dssc.png" type="image/png" />
    <title>32 숫자 퀴즈</title>
    <style>
      :root {
        /* 배경: 첨부 사진 느낌의 청량한 그라데이션 */
        --bg-main: linear-gradient(135deg, #e0f2ff 0%, #b3d9ff 100%);
        --container-bg: rgba(255, 255, 255, 0.4);
        --text-color: #2c3e50;

        /* 리퀴드 글라스 버튼 스타일 */
        --glass-white: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(255, 255, 255, 0.5);
        --glass-shadow: rgba(0, 0, 0, 0.05);

        --accent-color: #007aff;
      }

      body.dark-mode {
        --bg-main: linear-gradient(135deg, #1a1a1a 0%, #001f3f 100%);
        --container-bg: rgba(0, 0, 0, 0.5);
        --text-color: #ffffff;
        --glass-white: rgba(255, 255, 255, 0.15);
        --glass-border: rgba(255, 255, 255, 0.1);
      }

      body {
        font-family:
          'Pretendard',
          -apple-system,
          sans-serif;
        text-align: center;
        background: var(--bg-main);
        background-attachment: fixed;
        color: var(--text-color);
        margin: 0;
        min-height: 100vh;
        padding: env(safe-area-inset-top) 20px 120px 20px;
        transition: background 0.6s ease;
        overflow-x: hidden;
      }

      .container {
        max-width: 850px;
        margin: 60px auto;
        background: var(--container-bg);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        padding: 50px 20px;
        border-radius: 40px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 25px 50px var(--glass-shadow);
      }

      /* 🌙 테마 버튼 (비밀의 문) */
      .theme-toggle {
        position: fixed;
        top: 25px;
        right: 25px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: var(--glass-white);
        backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border);
        cursor: pointer;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 20px var(--glass-shadow);
      }

      .theme-toggle svg {
        width: 28px;
        height: 28px;
        fill: var(--text-color);
        transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .theme-toggle.rolling svg {
        transform: rotate(360deg);
      }

      /* 📱 그리드 카드 */
      .grid {
        display: grid;
        gap: 15px;
        margin-top: 35px;
        grid-template-columns: repeat(8, 1fr);
      }

      @media (max-width: 768px) {
        .grid {
          grid-template-columns: repeat(5, 1fr);
        }
      }

      .card {
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--glass-white);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        font-size: 1.3rem;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 5px 15px var(--glass-shadow);
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .card.locked {
        opacity: 0.2;
        cursor: not-allowed;
        filter: grayscale(1);
        pointer-events: none;
      }

      .card:active:not(.locked) {
        transform: scale(0.85);
      }

      /* 🔘 선택지 버튼 컨테이너 (레이아웃 핵심) */
      #options-grid {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin: 30px auto;
        width: 100%;
        max-width: 600px;
      }

      /* 수평 배치 (양자택일/OX) */
      .layout-row {
        flex-direction: row;
      }
      .layout-row .opt-btn {
        flex: 1;
        min-width: 120px;
      }

      /* 수직 배치 (선다형) */
      .layout-col {
        flex-direction: column;
      }
      .layout-col .opt-btn {
        width: 100%;
      }

      /* 리퀴드 글래스 버튼 공통 */
      .opt-btn {
        padding: 20px;
        border-radius: 20px;
        border: 1px solid var(--glass-border);
        background: var(--glass-white);
        color: var(--text-color);
        font-size: 1.4rem;
        font-weight: 800;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        box-shadow: 0 8px 20px var(--glass-shadow);
        transition: all 0.2s ease;
      }

      /* OX 전용 정사각형 디자인 */
      .opt-btn.is-ox {
        aspect-ratio: 1 / 1;
        max-width: 150px;
        font-size: 2.5rem;
      }

      .opt-btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 50%;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.4) 0%,
          rgba(255, 255, 255, 0) 100%
        );
      }

      .opt-btn:active {
        transform: scale(0.95);
        background: rgba(255, 255, 255, 0.9);
      }

      /* 푸터 */
      .footer {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 15px 30px;
        background: var(--glass-white);
        backdrop-filter: blur(15px);
        border-radius: 50px;
        border: 1px solid var(--glass-border);
        box-shadow: 0 10px 30px var(--glass-shadow);
        text-decoration: none;
        color: var(--text-color);
        z-index: 999;
      }

      .confetti {
        position: fixed;
        z-index: 2000;
        pointer-events: none;
      }

      #quiz-page {
        display: none;
      }
    </style>
  </head>
  <body>
    <button class="theme-toggle" onclick="handleThemeClick()" id="themeBtn">
      <svg viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <div class="container">
      <div id="main-page">
        <h1 style="font-weight: 900; letter-spacing: -2px; font-size: 2.2rem">
          번호를 골라주세요!
        </h1>
        <div class="grid" id="card-grid"></div>
      </div>

      <div id="quiz-page">
        <h1
          id="quiz-title"
          style="font-size: 1.1rem; opacity: 0.6; font-weight: 600"
        ></h1>
        <div
          id="question-text"
          style="
            font-size: 1.8rem;
            margin: 40px 0;
            font-weight: 800;
            line-height: 1.5;
            word-break: keep-all;
          "
        ></div>
        <div id="options-grid"></div>
        <div
          id="result-msg"
          style="margin-top: 30px; font-size: 1.6rem; font-weight: 900"
        ></div>
        <button
          onclick="goBack()"
          style="
            margin-top: 50px;
            padding: 16px 60px;
            border-radius: 20px;
            border: none;
            background: var(--text-color);
            color: white;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
          "
        >
          목록으로 돌아가기
        </button>
      </div>
    </div>

    <a href="https://www.instagram.com/dku_dssc" target="_blank" class="footer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204 0-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"
        />
      </svg>
      <span style="font-weight: 800; font-size: 1rem"
        >단국대 장애학생지원센터</span
      >
    </a>

    <script>
      const quizData = {
        1: {
          q: '모든 시각장애인은 전혀 보지 못한다.',
          opt: ['O', 'X'],
          ans: 'X',
        },
        2: {
          q: '시각장애인 동기와 걸을 때, 어느 쪽에서 걸어야 할까요?',
          opt: ['오른쪽', '왼쪽'],
          ans: '왼쪽',
        },
        3: {
          q: '장애인 차별 금지법이 시행된 연도는?',
          opt: ['2005년', '2007년', '2008년', '2010년'],
          ans: '2008년',
        },
      };

      const checkLock = () => localStorage.getItem('quiz_completed') === 'true';

      const grid = document.getElementById('card-grid');
      for (let i = 1; i <= 30; i++) {
        const card = document.createElement('div');
        card.className = 'card' + (checkLock() ? ' locked' : '');
        card.innerText = i;
        card.onclick = () => !checkLock() && showQuiz(i);
        grid.appendChild(card);
      }

      async function speak(text) {
        window.speechSynthesis.cancel();
        const parts = text.split('\n');
        for (const part of parts) {
          if (!part.trim()) continue;
          await new Promise((r) => {
            const u = new SpeechSynthesisUtterance(part);
            u.lang = 'ko-KR';
            u.onend = () => setTimeout(r, 1000);
            window.speechSynthesis.speak(u);
          });
        }
      }

      function showQuiz(num) {
        const data = quizData[num] || {
          q: `${num}번 준비 중!`,
          opt: ['확인'],
          ans: '확인',
        };
        document.getElementById('main-page').style.display = 'none';
        document.getElementById('quiz-page').style.display = 'block';
        document.getElementById('quiz-title').innerText = `${num}번 문제`;
        document.getElementById('question-text').innerText = data.q;

        const optGrid = document.getElementById('options-grid');
        optGrid.innerHTML = '';
        document.getElementById('result-msg').innerText = '';

        // 레이아웃 결정 (2개면 가로, 3개 이상이면 세로)
        if (data.opt.length <= 2) {
          optGrid.className = 'layout-row';
        } else {
          optGrid.className = 'layout-col';
        }

        data.opt.forEach((o) => {
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.innerText = o;

          // OX면 정사각형 클래스 추가
          if (o === 'O' || o === 'X') {
            btn.classList.add('is-ox');
          }

          btn.onclick = () => checkAnswer(num, o, data.ans);
          optGrid.appendChild(btn);
        });

        speak(`${num}번 문제입니다. \n ${data.q} \n 정답을 골라주세요.`);
      }

      function checkAnswer(num, userAns, correctAns) {
        localStorage.setItem('quiz_completed', 'true');
        const msg = document.getElementById('result-msg');

        if (userAns === correctAns) {
          msg.innerHTML = "<span style='color: #27ae60;'>정답입니다! 🎉</span>";
          fireConfetti();
        } else {
          msg.innerHTML =
            "<span style='color: #e74c3c;'>아쉽네요! 참여가 완료되었습니다.</span>";
        }

        document.getElementById('options-grid').style.pointerEvents = 'none';
        document
          .querySelectorAll('.card')
          .forEach((c) => c.classList.add('locked'));
      }

      // 🎊 폭죽 효과 강화 (개수 55개, 크기 50% 증가, 🎇 제외)
      function fireConfetti() {
        const emojis = ['🎉', '🎊', '✨', '🎈', '💙', '⭐'];
        for (let i = 0; i < 55; i++) {
          const c = document.createElement('div');
          c.className = 'confetti';
          c.innerText = emojis[Math.floor(Math.random() * emojis.length)];
          c.style.left = Math.random() * 100 + 'vw';
          c.style.top = '-80px';
          c.style.fontSize = Math.random() * 30 + 45 + 'px'; // 크기 대폭 증가
          c.style.transition = `all ${Math.random() * 2.5 + 3}s cubic-bezier(0.1, 0.5, 0.5, 1)`;
          document.body.appendChild(c);
          setTimeout(() => {
            c.style.top = '120vh';
            c.style.transform = `rotate(${Math.random() * 1000}deg) translateX(${Math.random() * 200 - 100}px)`;
          }, 10);
          setTimeout(() => c.remove(), 6000);
        }
      }

      function goBack() {
        window.speechSynthesis.cancel();
        document.getElementById('main-page').style.display = 'block';
        document.getElementById('quiz-page').style.display = 'none';
      }

      let clicks = 0;
      let clickTimer = null;

      function handleThemeClick() {
        clicks++;
        if (clicks === 1) {
          toggleTheme();
          clickTimer = setTimeout(() => {
            clicks = 0;
          }, 600);
        }
        if (clicks >= 3) {
          localStorage.removeItem('quiz_completed');
          alert('관리자 모드: 다시 테스트할 수 있습니다.');
          location.reload();
          clicks = 0;
          clearTimeout(clickTimer);
        }
      }

      function toggleTheme() {
        const btn = document.getElementById('themeBtn');
        btn.classList.add('rolling');
        document.body.classList.toggle('dark-mode');
        setTimeout(() => btn.classList.remove('rolling'), 600);
      }
    </script>
  </body>
</html>
